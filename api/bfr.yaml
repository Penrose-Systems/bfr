  color_space:
    doc: How a window's display reads the values a swapchain presents.
    values:
      srgb: {value: 1, doc: sRGB. Every window has it.}
      srgb_extended_linear: {value: 2, doc: "scRGB: sRGB primaries, linear, values beyond 0 to 1."}
      srgb_extended: {value: 3, doc: "sRGB primaries and curve, values beyond 0 to 1."}
      display_p3: {value: 4, doc: Display P3 with the sRGB curve.}
      display_p3_linear: {value: 5, doc: "Display P3, linear."}
      dci_p3: {value: 6, doc: DCI-P3 with its own curve.}
      bt709: {value: 7, doc: BT.709 with its curve.}
      bt709_linear: {value: 8, doc: "BT.709, linear."}
      bt2020_linear: {value: 9, doc: "BT.2020, linear."}
      hdr10_pq: {value: 10, doc: "HDR10: BT.2020 with the PQ (ST 2084) curve."}
      hdr10_hlg: {value: 11, doc: BT.2020 with the HLG curve.}
      dolby_vision: {value: 12, doc: Dolby Vision.}
      adobe_rgb: {value: 13, doc: Adobe RGB with its curve.}
      adobe_rgb_linear: {value: 14, doc: "Adobe RGB, linear."}
      pass_through: {value: 15, doc: Values reach the display as they are.}
      display_native: {value: 16, doc: The display's own space (AMD FreeSync 2).}

  display_rotation:
    doc: How a window's display is turned relative to its natural orientation.
    values:
      none: {value: 0, doc: Not turned.}
      rotate_90: {value: 1, doc: Turned 90 degrees clockwise.}
      rotate_180: {value: 2, doc: Turned 180 degrees.}
      rotate_270: {value: 3, doc: Turned 270 degrees clockwise.}
      other: {value: 4, doc: "Mirrored, or left to the platform."}

  present_mode:
    doc: >-
      How a swapchain presents. Which ones a window allows is in
      bfr_swapchain_caps.
    values:
      fifo: {value: 0, doc: Presents wait for vertical blank and queue up. Always available.}
      fifo_relaxed: {value: 1, doc: "As fifo, but a late frame presents at once, and may tear."}
      mailbox: {value: 2, doc: "Presents wait for vertical blank, and a newer frame replaces a waiting one."}
      immediate: {value: 3, doc: "Presents at once, and may tear."}

  alpha_mode:
    doc: >-
      How a window blends a swapchain's alpha. Which ones a window allows is in
      bfr_swapchain_caps.
    values:
      opaque: {value: 0, doc: The window ignores alpha.}
      premultiplied: {value: 1, doc: "Colors are already multiplied by alpha."}
      postmultiplied: {value: 2, doc: "The window multiplies colors by alpha."}
      inherit: {value: 3, doc: The window system decides how alpha blends.}

  queue_type:
    doc: What a queue runs.
    values:
      graphics: {value: 0, doc: "Graphics, compute and copies."}
      compute: {value: 1, doc: "Compute and copies."}
      copy: {value: 2, doc: Copies alone.}

  swapchain_status:
    doc: What the backend said of a swapchain as an image was acquired or presented.
    values:
      matches: {value: 0, doc: It said nothing more than that the call succeeded.}
      suboptimal: {value: 1, doc: "It no longer matches its window exactly but still presents; Vulkan's VK_SUBOPTIMAL_KHR. bfr_resize_swapchain makes it match, when the caller chooses."}

  tile_mapping:
    doc: What a tile mapping does to its region.
    values:
      map: {value: 0, doc: "Maps the region to the memory's tiles."}
      unmap: {value: 1, doc: Leaves the region with no memory; memory_tile is unused.}

