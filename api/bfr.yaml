  timestamp_stage:
    doc: >-
      The point in a list's work a timestamp is written at. Which ones a
      backend takes, inside and outside rendering, is in bfr_caps_timestamps.
    values:
      end: {value: 0, doc: Once all the work recorded before it is done.}
      start: {value: 1, doc: Once the work recorded before it has started.}
      vertex: {value: 2, doc: Once the vertex shading recorded before it is done.}
      fragment: {value: 3, doc: Once the fragment shading recorded before it is done.}
      compute: {value: 4, doc: Once the compute shading recorded before it is done.}
      copy: {value: 5, doc: Once the copies recorded before it are done.}
      task: {value: 6, doc: Once the task shading recorded before it is done.}
      mesh: {value: 7, doc: Once the mesh shading recorded before it is done.}
      ray_tracing: {value: 8, doc: Once the ray tracing shading recorded before it is done.}
      acceleration_structure_build: {value: 9, doc: Once the acceleration structure builds and copies recorded before it are done.}

  timestamp_granularity:
    doc: How exactly a timestamp marks its stage, where bfr_caps_timestamps.granularity says the backend takes it.
    values:
      relaxed: {value: 0, doc: "The backend may write it later than the stage ends, costing less."}
      precise: {value: 1, doc: As close to the stage's end as the backend can.}

  query_type:
    doc: What a pool's queries count between bfr_begin_query and bfr_end_query.
    values:
      occlusion: {value: 0, doc: "Samples that pass the depth and stencil tests: an exact count where bfr_begin_query asks for one, else 0 for none and another value for some."}
      pipeline_statistics: {value: 1, doc: The statistics bfr_query_pool_desc.statistics selects.}
      mesh_primitives_generated: {value: 2, doc: Primitives mesh shaders emit.}

  pipeline_statistic:
    doc: >-
      One statistic a pipeline_statistics query counts, in Vulkan's bit order,
      which is D3D12's field order. Each counts what the backend counts:
      tessellation_control is patches on Vulkan and hull shader invocations on
      D3D12.
    values:
      input_vertices: {value: 0}
      input_primitives: {value: 1}
      vertex_invocations: {value: 2}
      geometry_invocations: {value: 3}
      geometry_primitives: {value: 4}
      clip_invocations: {value: 5}
      clip_primitives: {value: 6}
      fragment_invocations: {value: 7}
      tessellation_control: {value: 8}
      tessellation_evaluation_invocations: {value: 9}
      compute_invocations: {value: 10}
      task_invocations: {value: 11}
      mesh_invocations: {value: 12}

  host_clock:
    doc: A host clock a GPU timestamp can be read beside.
    values:
      monotonic: {value: 0, doc: "CLOCK_MONOTONIC, which std::chrono::steady_clock reads on Linux."}
      monotonic_raw: {value: 1, doc: CLOCK_MONOTONIC_RAW.}
      performance_counter: {value: 2, doc: "QueryPerformanceCounter, which std::chrono::steady_clock reads on Windows."}

  queue_level:
    doc: >-
      A queue's priority against every queue on the system, other processes'
      included. Which levels each kind of queue takes is in bfr_caps_queues;
      one above normal may need privileges the process lacks, and then fails
      as the backend says.
    values:
      normal: {value: 0, doc: "The system's default, which a backend's queues have when none is set."}
      low: {value: 1, doc: Below the default.}
      high: {value: 2, doc: Above the default.}
      realtime: {value: 3, doc: The highest.}

  load_op:
    doc: What an attachment holds when rendering begins.
    values:
      load: {value: 0, doc: What the image held before.}
      clear: {value: 1, doc: The clear color.}
      dont_care: {value: 2, doc: Anything; the renderer writes every pixel.}

  store_op:
    doc: What becomes of an attachment when rendering ends.
    values:
      store: {value: 0, doc: What was rendered is kept.}
      dont_care: {value: 1, doc: It may be dropped.}

  resolve_mode:
    doc: >-
      How the samples of a depth or stencil pixel become one when a
      rendering's depth-stencil attachment is resolved; bfr_caps_resolve says
      which the device has.
    values:
      none: {value: 0, doc: Not resolved.}
      sample_zero: {value: 1}
      average: {value: 2}
      min: {value: 3}
      max: {value: 4}

  buffer_memory:
    doc: Where a buffer's memory is, and whether the CPU maps it.
    values:
      device: {value: 0, doc: On or nearest the GPU; the CPU does not map it.}
      upload: {value: 1, doc: The CPU writes it and the GPU reads it.}
      readback: {value: 2, doc: The GPU writes it and the CPU reads it.}

  texture_dimension:
    doc: The shape of a texture.
    values:
      d2: {value: 0, doc: "Width by height, in layers."}
      d1: {value: 1, doc: "Width, in layers."}
      d3: {value: 2, doc: Width by height by depth.}
      cube: {value: 3, doc: "Six square faces per cube, in layers: a multiple of 6, face by face, width equal to height."}

  texture_layout:
    doc: >-
      How a texture's memory is arranged for what the GPU does with it next.
      bfr_texture_barrier moves a texture between layouts; BFR keeps no record
      of the one it is in. A copy queue's lists move a texture only between
      undefined, copy_src and copy_dst, and a compute queue's never to or from
      color_target, depth_stencil_target, depth_stencil_read, resolve_src or
      resolve_dst, as D3D12's
      layouts for those queues allow; so a texture crosses between queues in a
      layout both kinds take.
    values:
      undefined: {value: 0, doc: Its contents are not kept. Only a layout to move from.}
      copy_src: {value: 1, doc: Copies read it.}
      copy_dst: {value: 2, doc: Copies write it.}
      sampled: {value: 3, doc: Shaders read it through the texture table.}
      storage: {value: 4, doc: Shaders read and write it through the storage texture table.}
      color_target: {value: 5, doc: Rendering writes color to it.}
      depth_stencil_target: {value: 6, doc: Rendering tests and writes depth or stencil in it.}
      depth_stencil_read: {value: 7, doc: "Rendering tests depth or stencil in it without writing, as a read_only depth-stencil attachment; shaders may sample it meanwhile."}
      resolve_src: {value: 8, doc: bfr_resolve_texture reads it.}
      resolve_dst: {value: 9, doc: bfr_resolve_texture writes it.}

  texture_aspect:
    doc: Which part of a texel a copy moves.
    values:
      color: {value: 0, doc: "The texel, of any format but a depth or stencil one."}
      depth: {value: 1, doc: The depth of a depth format.}
      stencil: {value: 2, doc: The stencil of a stencil format.}

  topology:
    doc: >-
      What draws assemble vertices into. Lists take each primitive's vertices
      apart; strips share each one with the next.
    values:
      triangle_list: {value: 0, doc: Each three vertices a triangle.}
      triangle_strip: {value: 1, doc: Each vertex and the two before it a triangle.}
      triangle_fan: {value: 2, doc: "Each two vertices and the first a triangle, where bfr_caps_features.triangle_fans."}
      line_list: {value: 3, doc: Each two vertices a line.}
      line_strip: {value: 4, doc: Each vertex and the one before it a line.}
      point_list: {value: 5, doc: Each vertex a point.}

  primitive_restart:
    doc: >-
      Whether an index of all ones ends a strip and starts the next, in
      indexed draws, and the index type it is all ones of: D3D12 fixes that
      value in the pipeline. Restart on a list topology needs
      bfr_caps_features.list_restart.
    values:
      "off": {value: 0, doc: No index restarts.}
      index16: {value: 1, doc: "0xFFFF restarts, with 16-bit indices."}
      index32: {value: 2, doc: "0xFFFFFFFF restarts, with 32-bit indices."}

  cull_mode:
    doc: Which triangles a graphics pipeline discards by the way they face.
    values:
      none: {value: 0, doc: Neither.}
      front: {value: 1, doc: Those facing the viewer.}
      back: {value: 2, doc: Those facing away.}

  front_face:
    doc: Which winding of a triangle's vertices on screen faces the viewer.
    values:
      counter_clockwise: {value: 0}
      clockwise: {value: 1}

  fill_mode:
    doc: How a graphics pipeline fills triangles.
    values:
      solid: {value: 0, doc: Every pixel inside.}
      wireframe: {value: 1, doc: Their edges as lines.}

  compare_op:
    doc: >-
      How a depth or stencil test compares the new value against the one
      stored, or a compare sampler a reference against each texel; the test
      passes when the comparison holds.
    values:
      always: {value: 0, doc: Passes every time.}
      never: {value: 1, doc: Fails every time.}
      less: {value: 2}
      equal: {value: 3}
      less_equal: {value: 4}
      greater: {value: 5}
      not_equal: {value: 6}
      greater_equal: {value: 7}

  stencil_op:
    doc: What a stencil test does to the stored stencil value.
    values:
      keep: {value: 0, doc: Leaves it.}
      zero: {value: 1, doc: Sets it to 0.}
      replace: {value: 2, doc: Sets it to the reference value.}
      increment_clamp: {value: 3, doc: Adds 1 and stops at the largest value.}
      decrement_clamp: {value: 4, doc: Subtracts 1 and stops at 0.}
      invert: {value: 5, doc: Flips every bit.}
      increment_wrap: {value: 6, doc: Adds 1 and wraps to 0.}
      decrement_wrap: {value: 7, doc: Subtracts 1 and wraps to the largest value.}

  blend_factor:
    doc: >-
      What a blend multiplies a color or alpha by. src is the fragment's,
      dst the target's, constant the blend constants set when recording.
    values:
      zero: {value: 0}
      one: {value: 1}
      src_color: {value: 2}
      one_minus_src_color: {value: 3}
      dst_color: {value: 4}
      one_minus_dst_color: {value: 5}
      src_alpha: {value: 6}
      one_minus_src_alpha: {value: 7}
      dst_alpha: {value: 8}
      one_minus_dst_alpha: {value: 9}
      constant_color: {value: 10}
      one_minus_constant_color: {value: 11}
      constant_alpha: {value: 12}
      one_minus_constant_alpha: {value: 13}
      src_alpha_saturate: {value: 14, doc: The lesser of the source alpha and one minus the destination alpha.}

  blend_op:
    doc: How a blend combines the source and destination once each is multiplied by its factor.
    values:
      add: {value: 0}
      subtract: {value: 1, doc: Source minus destination.}
      reverse_subtract: {value: 2, doc: Destination minus source.}
      min: {value: 3, doc: The lesser; the factors are ignored.}
      max: {value: 4, doc: The greater; the factors are ignored.}

  index_type:
    doc: How wide each index of an index buffer is.
    values:
      uint32: {value: 0, doc: Four bytes an index.}
      uint16: {value: 1, doc: Two bytes an index.}

  filter:
    doc: How a sampler picks texels, or mip levels, around a coordinate.
    values:
      nearest: {value: 0, doc: The nearest one.}
      linear: {value: 1, doc: The nearest ones blended by distance.}

  address_mode:
    doc: What a sampler reads for a coordinate outside 0 to 1.
    values:
      repeat: {value: 0, doc: The texture tiled.}
      mirror_repeat: {value: 1, doc: "The texture tiled, every other tile mirrored."}
      clamp_to_edge: {value: 2, doc: The nearest edge texel.}
      clamp_to_border: {value: 3, doc: The sampler's border colour.}
      mirror_clamp_to_edge: {value: 4, doc: "Mirrored once, then the nearest edge texel; bfr_caps_features.sampler_mirror_clamp_to_edge."}

  sampler_reduction:
    doc: What a sample returns from the texels it reads.
    values:
      weighted_average: {value: 0, doc: "The texels filtered, as usual."}
      compare: {value: 1, doc: "Each texel compared against a reference by compare_op, then the results filtered."}
      minimum: {value: 2, doc: The least of each component; bfr_caps_features.sampler_minmax.}
      maximum: {value: 3, doc: The greatest of each component; bfr_caps_features.sampler_minmax.}

  acceleration_structure_type:
    doc: What an acceleration structure holds.
    values:
      bottom: {value: 0, doc: Triangles or boxes.}
      top: {value: 1, doc: Instances of bottom structures; what shaders trace rays against.}
      opacity_micromap: {value: 2, doc: "Micromaps, which say which parts of a bottom structure's triangles are opaque; where bfr_caps_features.opacity_micromap."}
      partitioned_top: {value: 3, doc: "Instances in partitions, which builds write, update and move from records the GPU reads, rebuilding only the partitions they touch; traced as a top one is, from its own table; where bfr_caps_features.partitioned_top."}

  opacity_micromap_format:
    doc: >-
      The states a micromap's subtriangles take: 1 bit each for two, opaque or
      transparent, or 2 bits for four, adding unknown-opaque and
      unknown-transparent, which any-hit shaders decide.
    values:
      two_state: {value: 1}
      four_state: {value: 2}

  opacity_micromap_special_index:
    doc: >-
      Micromap indices that name no micromap: the whole triangle in one state.
      Written as they are into an index of bfr_triangle_opacity_micromap.index_type.
    values:
      fully_transparent: {value: -1}
      fully_opaque: {value: -2}
      fully_unknown_transparent: {value: -3}
      fully_unknown_opaque: {value: -4}

  instance_motion:
    doc: "How a motion instance moves: not at all, by its keyframes' matrices, or by their SRT transforms."
    values:
      none: {value: 0}
      matrix: {value: 1}
      srt: {value: 2}

  cluster_operation:
    doc: >-
      What a cluster operation does: moves structures, builds cluster bottom
      structures from clusters, builds clusters or cluster templates from
      triangles, instantiates templates into clusters, or fetches templates'
      indices, which is all Vulkan states of it. A cluster holds at most bfr_caps_ray_tracing.max_cluster_triangles
      triangles; a cluster bottom structure holds clusters and is what an
      instance names; a template is a cluster built without its positions.
      The values are Vulkan's.
    values:
      move: {value: 0}
      build_bottoms: {value: 1}
      build_clusters: {value: 2}
      build_templates: {value: 3}
      instantiate_templates: {value: 4}
      template_indices: {value: 5}

  cluster_mode:
    doc: >-
      Where a cluster operation's structures go: packed from one destination,
      their addresses and sizes written; at addresses the GPU reads, their
      sizes read; or nowhere, only their sizes written. The values are
      Vulkan's.
    values:
      implicit_destinations: {value: 0}
      explicit_destinations: {value: 1}
      compute_sizes: {value: 2}

  cluster_structure_type:
    doc: What a move moves. The values are Vulkan's.
    values:
      bottom: {value: 0}
      cluster: {value: 1}
      template: {value: 2}

  cluster_index_format:
    doc: "The index types of a cluster record's indices and micromap indices. The values are the records'."
    values:
      uint8: {value: 1}
      uint16: {value: 2}
      uint32: {value: 4}

  cluster_geometry_flag:
    doc: "The bits of a cluster geometry word's flags. The values are the records'."
    values:
      cull_disable: {value: 1}
      no_duplicate_any_hit: {value: 2}
      opaque: {value: 4}

  cluster_flag:
    doc: "The bits of a cluster record's cluster_flags. The values are the records'."
    values:
      allow_disable_opacity_micromaps: {value: 1, doc: Instances may disable its opacity micromaps.}

  partitioned_top_op_type:
    doc: "What a bfr_partitioned_top_op does: writes instances, updates them, or moves partitions. The values are the records'."
    values:
      write_instance: {value: 0}
      update_instance: {value: 1}
      write_partition_translation: {value: 2}

  partitioned_instance_flag:
    doc: "The bits of a bfr_partitioned_instance_record's flags. The values are the records'."
    values:
      cull_disable: {value: 1}
      front_counter_clockwise: {value: 2}
      force_opaque: {value: 4}
      force_non_opaque: {value: 8}
      explicit_bounds: {value: 16, doc: "The instance's bounds are read, and later update_instance records may name it."}

  build_preference:
    doc: What an acceleration structure build favours; passed to the backend as given.
    values:
      none: {value: 0}
      fast_trace: {value: 1}
      fast_build: {value: 2}

  instance_opacity:
    doc: How an instance's geometry counts as opaque.
    values:
      as_geometry: {value: 0, doc: As each geometry says.}
      force_opaque: {value: 1}
      force_non_opaque: {value: 2}

  ray_tracing_stage:
    doc: The stage a ray tracing pipeline's shader runs at.
    values:
      ray_generation: {value: 0}
      miss: {value: 1}
      closest_hit: {value: 2}
      any_hit: {value: 3}
      intersection: {value: 4}
      callable: {value: 5}

  ray_tracing_group_type:
    doc: What a ray tracing pipeline's group holds.
    values:
      general: {value: 0, doc: "general: one ray generation, miss or callable shader."}
      triangle_hit: {value: 1, doc: "closest_hit and any_hit, either no_shader, for triangles."}
      box_hit: {value: 2, doc: "intersection, and closest_hit and any_hit, either no_shader, for boxes."}

  acceleration_structure_property:
    doc: "What a property pool's entries hold, one per structure a write names, of bfr_caps_ray_tracing.property_entry_bytes each."
    values:
      compacted_size: {value: 0, doc: "The bytes a compact copy takes, of a structure built with allow_compaction."}
      serialized_size: {value: 1, doc: "The bytes bfr_serialize_acceleration_structure writes, where bfr_caps_features.acceleration_structure_serialization."}
      serialized_bottom_count: {value: 2, doc: "How many bottom structure references a serialized top structure holds, where bfr_caps_features.serialized_bottom_count."}
      current_size: {value: 3, doc: "The bytes the structure takes now, where bfr_caps_features.acceleration_structure_current_size."}

  ray_tracing_group_shader:
    doc: The shader of a group whose stack size bfr_get_ray_tracing_stack_size reads.
    values:
      general: {value: 0}
      closest_hit: {value: 1}
      any_hit: {value: 2}
      intersection: {value: 3}

  window_system:
    doc: >-
      Which window system a bfr_window comes from, for the platforms that have
      more than one.
    values:
      default: {value: 0, doc: "The platform's own: Win32 on Windows, Cocoa on Apple, X11 on Linux."}
      wayland: {value: 1, doc: Wayland. Linux only.}
      headless: {value: 2, doc: No window. Images are presented nowhere; for tests and offscreen tools.}

objects:
  instance:
    destroy: destroy_instance
    doc: >-
      One backend in this process. Several may exist at once. Do not destroy
      it while another thread is calling a function on it.
  device:
    destroy: destroy_device
    doc: >-
      An open adapter. Creates and owns every handle. Its functions may be
      called from several threads at once, except as a handle's doc says. Do
      not destroy it while another thread is calling a function on it.

handles:
  swapchain:
    parent: device
    destroy: destroy_swapchain
    doc: >-
      The images presented to one window. Calls on one swapchain must not
      overlap, destroying it included, and a bfr_submit of a list that renders
      to it counts as one; the caller synchronizes them. Different swapchains
      may be used from different threads at once.

  command_pool:
    parent: device
    destroy: destroy_command_pool
    doc: >-
      Where command lists for one queue are recorded from: the memory they
      record into, given back to the pool by bfr_reset_command_pool once the
      GPU has run them. Calls on one pool, and recording on the lists it made,
      must not overlap; the caller synchronizes them. Different pools may be
      used from different threads at once.

  command_list:
    parent: device
    destroy: destroy_command_list
    plain: true
    doc: >-
      Commands recorded for the GPU, from bfr_begin_commands until bfr_submit
      sends them to the queue of the pool they came from. Calls on one command
      list must not overlap; the caller synchronizes them.

  buffer:
    parent: device
    destroy: destroy_buffer
    doc: Memory the GPU reads and writes, as its bfr_buffer_usage says.

  texture:
    parent: device
    destroy: destroy_texture
    doc: Texels the GPU reads and writes, as its bfr_texture_usage says.

  pipeline:
    parent: device
    destroy: destroy_pipeline
    doc: >-
      A compute or graphics pipeline: shaders with the fixed state they run
      under. Every pipeline shares one resource layout, which its shaders
      declare as follows. Four unbounded tables, each indexed by the slot a
      resource is given when it is created, which bfr_get_buffer_slots,
      bfr_get_texture_slots and bfr_get_sampler_slot report and which is the same number on every
      backend, and one block of the caps' max_push_constants_size bytes of push
      constants that every stage reads, set by bfr_push_constants. On Vulkan the tables are the
      bindings of descriptor set 0, in order: 0 sampled images, 1 storage
      images, 2 storage buffers, 3 samplers, each an update-after-bind and
      partially-bound runtime array; the push constants are a push constant
      range over all stages. On D3D12 the tables are unbounded descriptor
      ranges, each starting at register 0 of its own space: SRV space 0
      sampled textures, UAV space 1 storage textures, UAV space 2 storage
      buffers as raw buffer views, sampler space 3 samplers; the push constants are
      max_push_constants_size / 4 root constants at b0 of space 0. On Metal
      the tables are one argument buffer at buffer(0), holding the sampled
      textures, storage textures, storage buffers and samplers in that order,
      each a region of as many 8-byte entries as the bfr_device_desc's
      max_bindless member for its kind, so a shader declares them with the
      sizes the device was opened with; the push constants are at buffer(1).
      Where bfr_caps_bindless.max_acceleration_structures is not 0 there is a
      fifth table, of top acceleration structures, by the slot
      bfr_get_acceleration_structure_slot reports: on Vulkan binding 4,
      acceleration structures, as the others are. Where
      bfr_caps_features.partitioned_top there is a partitioned top table, with
      or without the fifth, of partitioned top structures by their slots: on
      Vulkan binding 5, partitioned acceleration structures, which shaders
      declare as acceleration structures. D3D12 and Metal have neither
      yet. Where bfr_caps_bindless.max_uniform_buffers is not 0 there is a
      uniform buffer table, by the uniform slot bfr_get_buffer_slots reports:
      on Vulkan binding 6, uniform buffers, as the others are, each the whole
      buffer. D3D12 and Metal have none yet. A
      pipeline's shaders are bytecode for the backend the device runs on.

  sampler:
    parent: device
    destroy: destroy_sampler
    doc: How shaders read a texture through the sampler table, as its bfr_sampler_desc says.

  timestamp_pool:
    parent: device
    destroy: destroy_timestamp_pool
    doc: GPU timestamps that command lists write and resolve into a buffer.

  query_pool:
    parent: device
    destroy: destroy_query_pool
    doc: GPU queries that command lists begin, end and resolve into a buffer.

  sparse_memory:
    parent: device
    destroy: destroy_sparse_memory
    doc: Device memory that sparse textures' and buffers' tiles are mapped into by bfr_update_tile_mappings.

  acceleration_structure:
    parent: device
    destroy: destroy_acceleration_structure
    doc: >-
      Geometry or instances arranged for rays to be traced against, in memory
      the device allocates. A bottom structure holds triangles or boxes; a
      top one holds instances of bottom ones, and is what shaders trace rays
      against.

  shader:
    parent: device
    destroy: destroy_shader
    doc: >-
      Code compiled once and named by the ray tracing pipelines made from it,
      which keep what they need of it: it may be destroyed once they are made.

  acceleration_structure_property_pool:
    parent: device
    destroy: destroy_acceleration_structure_property_pool
    doc: >-
      Entries of one bfr_acceleration_structure_property, written by command
      lists and resolved into a buffer. Calls on one pool must not overlap.

  pipeline_cache:
    parent: device
    destroy: destroy_pipeline_cache
    doc: >-
      Pipelines the backend has compiled, which it reads back as bytes for a
      later run to start from. Pipelines made with one look in it first and
      add themselves on a miss.

callbacks:
  message_callback:
    doc: >-
      Receives BFR's messages and validation's. Without one, BFR prints
      nothing. Called on any thread, including threads BFR or the driver
      owns, until the instance and every device made from it are destroyed.
    params:
      - {name: severity, type: message_severity}
      - {name: message, type: string, doc: Valid only during the call.}
      - {name: user_data, type: opaque, optional: true}

structs:
  instance_desc:
    doc: How to create an instance.
    extensible: true
    members:
      - {name: backend, type: backend}
      - name: api_major
        type: u32
        doc: >-
          The API version the caller uses, in bfr_caps_info's terms (1, 2 is
          Vulkan 1.2), passed to the backend as it is. Below what BFR needs,
          which the backend's bfr_backend value states, bfr_create_instance
          fails with error_unsupported.
      - {name: api_minor, type: u32, doc: The minor part of api_major's version.}
      - {name: validation, type: bool, doc: Enable the backend's validation layer. On Metal its messages go to the system log.}
      - {name: message_callback, type: message_callback, optional: true}
      - {name: min_severity, type: message_severity, doc: The least severe message to send.}
      - name: message_user_data
        type: opaque
        optional: true
        user_data: message_callback
        doc: >-
          Passed to message_callback, which may still be called after
          bfr_destroy_instance while a device lives.
      - name: application_name
        type: string
        doc: >-
          The application's name, passed to the backend where it takes one; read during the call
          only. Empty is none.
      - {name: application_version, type: u32, doc: "The application's version, passed as given where the backend takes one."}
      - {name: engine_name, type: string, doc: "The engine's name, as application_name."}
      - {name: engine_version, type: u32, doc: "The engine's version, as application_version."}
      - name: call_timings
        type: bool
        doc: >-
          Time the CPU spends in each call of the instance and its devices, which
          bfr_get_call_timings and bfr_get_instance_call_timings give. Off, it costs
          nothing; on, each call reads the clock twice.

  adapter_info:
    doc: An adapter, as an instance lists it. Nothing is opened.
    members:
      - {name: name, type: string, lifetime: instance}
      - {name: type, type: adapter_type}

  window:
    doc: >-
      A window to present to. The caller's windowing code made it; the values
      stay valid while it is open. All zero means no window.
    members:
      - name: window
        type: opaque
        doc: >-
          The window: an HWND on Windows, a Window XID on X11 (as a pointer), a
          wl_surface* on Wayland, a CAMetalLayer* on Apple.
      - name: display
        type: opaque
        doc: The Display* on X11, the wl_display* on Wayland, the HINSTANCE on Windows; unused on Apple.
      - {name: system, type: window_system}

  queue_desc:
    doc: One queue a device opens.
    members:
      - name: rank
        type: f32
        doc: >-
          0 to 1: its priority against the device's other queues, higher first; passed to the
          backend as given. Where bfr_caps_queues.ranks is 0 the backend doesn't rank a device's
          queues, so queues of different ranks fail the device with error_unsupported.
      - name: level
        type: queue_level
        doc: >-
          Its priority against every queue on the system; 0 is normal. A level the backend has no
          setting for fails the device with error_unsupported. Vulkan sets one level for all the
          queues of a kind, so there different levels in one kind fail the same way.

  device_desc:
    doc: >-
      How to open an adapter. The device's queues are numbered: the graphics
      queues from 0, then the compute queues, then the copy queues, in the
      order asked for here. A graphics queue's lists run every call. A compute
      queue's run all but rendering, draws, the calls that set their state or
      bind a graphics pipeline or an index buffer, and bfr_resolve_texture; a
      copy queue's run only copies, barriers and bfr_write_timestamp. A copy
      between a buffer and a texture's depth or stencil runs only in a
      graphics queue's lists, and one in a copy queue's has a buffer_offset
      that is a multiple of 4. bfr_texture_layout says which layouts each
      kind's lists move a texture between.
    extensible: true
    members:
      - {name: adapter, type: u32, doc: Index into the instance's adapter list.}
      - name: window
        type: window
        doc: >-
          The window one of the device's queues must be able to present to, else it fails with
          error_present_unsupported; all zero opens it without asking.
      - name: graphics_queues
        type: queue_desc
        array: graphics_queue_count
        pointer: in
        optional: true
        doc: >-
          The graphics queues to open, read during the call only; none is none. Fails with
          error_unsupported when the adapter has fewer; bfr_caps.queues says how many it has.
      - {name: graphics_queue_count, type: u32}
      - name: compute_queues
        type: queue_desc
        array: compute_queue_count
        pointer: in
        optional: true
        doc: >-
          The compute queues to open, as graphics_queues says.
      - {name: compute_queue_count, type: u32}
      - name: copy_queues
        type: queue_desc
        array: copy_queue_count
        pointer: in
        optional: true
        doc: The copy queues to open, as graphics_queues says.
      - {name: copy_queue_count, type: u32}
      - name: max_command_lists
        type: u32
        doc: >-
          Command lists the device holds at once, across all its pools, and the most swapchains
          its recording lists render to at once; past it, calls fail with error_limit_reached. Room
          for them is made with the device, so recording and submitting never allocate. A
          bfr_submit of more lists than this fails with error_invalid_argument. 0 is none.
      - name: max_command_pools
        type: u32
        doc: Command pools the device holds at once, 0 for none; past it, bfr_create_command_pool fails with error_limit_reached.
      - name: max_swapchains
        type: u32
        doc: Swapchains the device holds at once, 0 for none; past it, bfr_create_swapchain fails with error_limit_reached.
      - name: max_bindless_textures
        type: u32
        doc: >-
          Slots in the sampled texture table bfr_pipeline describes, 0 for none. Made with the device, passed to
          the backend as given; bfr_caps_bindless.max_textures says how many the adapter holds, and more is
          the backend's to refuse, which Vulkan's validation does. D3D12 makes the three resource tables in one heap, so there they fail with
          error_limit_reached when together they are more than it holds.
      - name: max_bindless_storage_textures
        type: u32
        doc: Slots in the storage texture table, as max_bindless_textures says; bfr_caps_bindless.max_storage_textures says how many the adapter holds.
      - name: max_bindless_storage_buffers
        type: u32
        doc: Slots in the storage buffer table, as max_bindless_textures says; bfr_caps_bindless.max_storage_buffers says how many the adapter holds.
      - name: max_bindless_samplers
        type: u32
        doc: Slots in the sampler table, passed as max_bindless_textures is; bfr_caps_bindless.max_samplers says how many the adapter holds.
      - name: max_bindless_uniform_buffers
        type: u32
        doc: Slots in the uniform buffer table, passed as max_bindless_textures is. Where bfr_caps_bindless.max_uniform_buffers is 0 the adapter has no such table, and more than 0 fails with error_limit_reached.
      - name: max_timestamp_pools
        type: u32
        doc: Timestamp pools the device holds at once, 0 for none; past it, bfr_create_timestamp_pool fails with error_limit_reached.
      - name: max_query_pools
        type: u32
        doc: Query pools the device holds at once, 0 for none; past it, bfr_create_query_pool fails with error_limit_reached.
      - name: max_debug_label_length
        type: u32
        doc: >-
          The longest bfr_debug_label name, in bytes, the label calls take.
          Room for one, and the '\0' the backend reads as its end, is made for
          each list and each queue with the device.
      - name: max_sparse_memories
        type: u32
        doc: Sparse memories the device holds at once, 0 for none; past it, bfr_create_sparse_memory fails with error_limit_reached.
      - name: max_tile_mappings
        type: u32
        doc: >-
          The most texture regions and the most buffer regions one bfr_update_tile_mappings takes; room
          for them is made with the device, so mapping never allocates. More fails with
          error_invalid_argument. 0 is none.
      - name: max_bindless_acceleration_structures
        type: u32
        doc: >-
          Slots in the acceleration structure table, of top structures, passed as max_bindless_textures
          is; bfr_caps_bindless.max_acceleration_structures says how many the adapter holds. Where that
          is 0 the device has no such table, and more than 0 fails with error_limit_reached. With 0
          slots, top structures are made with none.
      - name: max_bindless_partitioned_tops
        type: u32
        doc: >-
          Slots in the partitioned top table bfr_pipeline states, of partitioned top structures; with
          0, they are made with none. No limit names it: the backend says whether it holds the tables together.
          Where bfr_caps_features.partitioned_top is false, more than 0 fails with
          error_limit_reached.
      - name: max_build_geometries
        type: u32
        doc: >-
          The most geometries one build takes, in bfr_build_acceleration_structure and
          bfr_get_acceleration_structure_sizes; a top structure's instances are one geometry. Room
          for them is made with the device, so building never allocates. More fails with
          error_limit_reached. 0 is none.
      - name: max_acceleration_structure_property_pools
        type: u32
        doc: "Property pools the device holds at once, 0 for none; past it, bfr_create_acceleration_structure_property_pool fails with error_limit_reached."
      - name: max_buffers
        type: u32
        doc: "Buffers the device holds at once, 0 for none; past it, bfr_create_buffer fails with error_limit_reached."
      - name: max_textures
        type: u32
        doc: "Textures the device holds at once, 0 for none; past it, bfr_create_texture fails with error_limit_reached."
      - name: max_shaders
        type: u32
        doc: "Shaders the device holds at once, 0 for none; past it, bfr_create_shader fails with error_limit_reached."
      - name: max_pipelines
        type: u32
        doc: "Pipelines the device holds at once, 0 for none; past it, bfr_create_compute_pipeline, bfr_create_graphics_pipeline and bfr_create_ray_tracing_pipeline fails with error_limit_reached."
      - name: max_pipeline_caches
        type: u32
        doc: "Pipeline caches the device holds at once, 0 for none; past it, bfr_create_pipeline_cache fails with error_limit_reached."
      - name: max_acceleration_structures
        type: u32
        doc: "Acceleration structures the device holds at once, 0 for none; past it, bfr_create_acceleration_structure fails with error_limit_reached."
      - name: indirect_strides
        type: u32
        array: indirect_stride_count
        pointer: in
        optional: true
        doc: >-
          The strides, in bytes, the device's indirect draws take, read during the call only. D3D12
          fixes a stride in the command signature it makes for them, so it makes one for each here and
          fails an indirect draw of any other with error_unsupported; Vulkan and Metal take any stride.
      - {name: indirect_stride_count, type: u32}

  swapchain_desc:
    doc: How to create a swapchain.
    extensible: true
    members:
      - {name: window, type: window, doc: The window to present to.}
      - name: queue
        type: u32
        doc: >-
          The device's queue that presents its images; one the device lacks fails with
          error_invalid_argument.
      - name: image_count
        type: u32
        doc: >-
          Images to request, passed to the backend as given. bfr_swapchain_images says how many it
          made.
      - name: present_mode
        type: present_mode
        doc: >-
          How to present; 0 is fifo. Fails with error_unsupported when the backend has no setting
          for it.
      - name: format
        type: format
        doc: >-
          The images' format. Fails with error_unsupported when the backend has no setting for it
          with color_space.
      - name: color_space
        type: color_space
        doc: How the display reads the images.
      - name: alpha_mode
        type: alpha_mode
        doc: >-
          How the window blends alpha; 0 is opaque. Fails with error_unsupported when the backend
          has no setting for it.

  swapchain_images:
    doc: >-
      A swapchain's current images: their size and number, which are 0 while the window has no area,
      and the format, color space, present mode and alpha mode in use, whether the desc set them or
      left them at 0.
    members:
      - {name: width, type: u32}
      - {name: height, type: u32}
      - {name: count, type: u32}
      - {name: format, type: format}
      - {name: color_space, type: color_space}
      - {name: present_mode, type: present_mode}
      - {name: alpha_mode, type: alpha_mode}

  color_attachment:
    doc: >-
      One color target of a rendering: a texture with color_attachment usage,
      in layout color_target, or the swapchain's acquired image when
      bfr_begin_rendering is given a swapchain and this is attachment 0. Given
      a swapchain, attachment 0 may instead name a multisampled texture of the
      swapchain's format, which is then resolved into the acquired image.
    members:
      - {name: texture, type: texture, doc: Null for the swapchain's image.}
      - {name: mip_level, type: u32, doc: The mip level drawn to.}
      - {name: layer, type: u32, doc: "The first layer drawn to; a cube's faces are its layers, and a 3D texture's depth slices are where bfr_caps_features.volume_color_targets."}
      - name: layer_count
        type: u32
        default: one_layer
        doc: >-
          The layers drawn to from layer. Vulkan and Metal draw one count of
          layers in a rendering: the depth-stencil attachment's where there is
          one, else color attachment 0's. On Vulkan each level and layer of a
          texture with an attachment usage is a view made with it.
      - {name: load_op, type: load_op, doc: What it holds at the start; 0 is load.}
      - {name: store_op, type: store_op, doc: What becomes of it at the end; 0 is store.}
      - {name: clear_color, type: f32, fixed: 4, doc: "Red, green, blue and alpha, 0 to 1, when load_op is clear."}
      - {name: clear_integer, type: bool, doc: "The target holds integers: clear_color_integer applies instead. D3D12 clears with floats, so there a value a 32-bit float does not hold exactly fails with BFR_RESULT_ERROR_INVALID_ARGUMENT."}
      - {name: clear_color_integer, type: u32, fixed: 4, doc: "Red, green, blue and alpha bits, when load_op is clear; a signed format reads them as int32."}
      - {name: resolve_texture, type: texture, doc: "A single-sample texture of texture's format and size, with color_attachment usage, in layout color_target, that texture's samples are resolved into as rendering ends; null for none, and null for the attachment the swapchain's image is resolved into. Non-integer formats average and integer ones take sample zero, as the backend resolves; bfr_format_caps.resolve says which formats resolve. It is resolved into at its mip level 0, from layer 0."}

  depth_stencil_attachment:
    doc: >-
      The depth-stencil target of a rendering: a texture with depth_stencil
      usage, in layout depth_stencil_target, or depth_stencil_read when
      read_only. Depth and stencil each load and store as their ops say; an op
      of an aspect the format lacks is ignored.
    members:
      - {name: texture, type: texture, doc: Null for no depth-stencil target.}
      - {name: mip_level, type: u32, doc: The mip level drawn to.}
      - {name: layer, type: u32, doc: The first layer drawn to.}
      - {name: layer_count, type: u32, default: one_layer, doc: "The layers drawn to from layer, as bfr_color_attachment's are."}
      - {name: depth_load_op, type: load_op, doc: 0 is load.}
      - {name: depth_store_op, type: store_op, doc: 0 is store.}
      - {name: stencil_load_op, type: load_op, doc: 0 is load.}
      - {name: stencil_store_op, type: store_op, doc: 0 is store.}
      - {name: clear_depth, type: f32, doc: "0 to 1, when depth_load_op is clear."}
      - {name: clear_stencil, type: u32, doc: When stencil_load_op is clear. The low 8 bits count.}
      - {name: read_only, type: bool, doc: "The rendering tests depth and stencil but never writes them, and shaders may sample the texture meanwhile; every op is then load and store. The pipelines drawn with write neither depth nor stencil."}
      - {name: resolve_texture, type: texture, doc: "A single-sample texture of texture's format and size, with depth_stencil usage, in layout depth_stencil_target, that the samples are resolved into as rendering ends, by depth_resolve and stencil_resolve, at its mip level 0, from layer 0; null for none."}
      - {name: depth_resolve, type: resolve_mode, doc: 0 is none.}
      - {name: stencil_resolve, type: resolve_mode, doc: 0 is none.}

  rendering_desc:
    doc: >-
      How to begin rendering: the attachments drawn to, all of one size and
      sample count, which the graphics pipelines drawn with were made for. The
      first color_attachment_count color attachments are drawn to, in the
      order the pipeline's targets are.
    extensible: true
    members:
      - {name: color_attachment_count, type: u32}
      - {name: color_attachments, type: color_attachment, fixed: max_color_targets}
      - {name: depth_stencil, type: depth_stencil_attachment}
      - name: occlusion_queries
        type: query_pool
        doc: >-
          The occlusion pool the queries begun in this rendering count into;
          null for none. Metal binds it to the rendering; Vulkan and D3D12
          take the pool at each bfr_begin_query, which names the same one.

  viewport:
    doc: >-
      Where on the attachments the rendering lands, in pixels from the top
      left, and the depth range it maps to. Clip space is the same on every
      backend: x right, y up, z 0 at the near plane and 1 at the far.
    members:
      - {name: x, type: f32}
      - {name: y, type: f32}
      - {name: width, type: f32}
      - {name: height, type: f32}
      - {name: min_depth, type: f32}
      - {name: max_depth, type: f32}

  rect:
    doc: A rectangle of pixels from the top left of the attachments.
    members:
      - {name: x, type: u32}
      - {name: y, type: u32}
      - {name: width, type: u32}
      - {name: height, type: u32}

  command_pool_desc:
    doc: How to create a command pool.
    extensible: true
    members:
      - {name: queue, type: u32, doc: "The queue its lists record for, numbered as bfr_device_desc says."}
      - name: list_count
        type: u32
        doc: >-
          Lists the pool holds, made with it from the device's max_command_lists. bfr_begin_commands
          hands them out in turn until bfr_reset_command_pool gives them back.
      - name: push_constant_updates
        type: u32
        doc: >-
          Most bfr_push_constants calls the pool's lists record between resets, which a backend
          that copies push constants into memory (Metal) makes room for with the pool; 0 is none.

  buffer_usage:
    doc: What the GPU does with a buffer. Set every use it will have.
    members:
      - {name: copy_src, type: bool}
      - {name: copy_dst, type: bool}
      - {name: uniform, type: bool, doc: "Shaders read it as constants, through its slot in the uniform buffer table. The table views the whole buffer, so its size is at most bfr_caps_limits.max_uniform_buffer_range."}
      - {name: storage, type: bool, doc: "Shaders read and write it. D3D12 views it in 32-bit values, so there its size must be a multiple of 4."}
      - {name: index, type: bool, doc: Indexed draws read it.}
      - {name: indirect, type: bool, doc: "Indirect draws, dispatches and traces read their arguments from it."}
      - name: acceleration_structure_input
        type: bool
        doc: >-
          Acceleration structure builds read vertices, indices, transforms,
          boxes or instances from it. It starts at an address of the alignment
          those take.
      - name: acceleration_structure_scratch
        type: bool
        doc: >-
          Acceleration structure builds use it as scratch. It starts at an
          address that is a multiple of bfr_caps_ray_tracing.scratch_alignment,
          and of 256 where bfr_caps_features.partitioned_top, as a partitioned
          top structure's build takes.
      - name: shader_binding_table
        type: bool
        doc: >-
          It holds shader binding table records. It starts at an address that
          is a multiple of bfr_caps_ray_tracing.table_alignment.
      - name: acceleration_structure_data
        type: bool
        doc: >-
          bfr_serialize_acceleration_structure writes it and
          bfr_deserialize_acceleration_structure reads it. It starts at an
          address that is a multiple of 256.
      - name: acceleration_structure_storage
        type: bool
        doc: >-
          bfr_build_clusters writes structures into it, and moves and builds
          read them from it, where bfr_caps_features.cluster_acceleration_structure.
          It starts at an address that is a multiple of
          bfr_caps_ray_tracing.cluster_alignment, cluster_template_alignment and
          cluster_bottom_alignment.

  buffer_desc:
    doc: How to create a buffer.
    extensible: true
    members:
      - {name: size, type: u64, doc: Bytes.}
      - {name: memory, type: buffer_memory, doc: 0 is device.}
      - {name: usage, type: buffer_usage}
      - {name: sparse, type: bool, doc: "Made with no memory: bfr_update_tile_mappings maps sparse memory's tiles into it, as bfr_caps_sparse says. memory is device."}
      - {name: sparse_aliased, type: bool, doc: "Its tiles may be mapped to memory other sparse resources' tiles are mapped to, where bfr_caps_sparse.aliased."}
      - {name: tile_bytes, type: u32, doc: "One of bfr_caps_sparse.tile_bytes, or 0 where that list is empty; only when sparse."}

  draw_indirect_args:
    doc: The arguments of one indirect draw, as a buffer holds them for bfr_draw_indirect; the layout every backend reads.
    members:
      - {name: vertex_count, type: u32}
      - {name: instance_count, type: u32}
      - {name: first_vertex, type: u32}
      - {name: first_instance, type: u32}

  draw_indexed_indirect_args:
    doc: The arguments of one indirect indexed draw, for bfr_draw_indexed_indirect.
    members:
      - {name: index_count, type: u32}
      - {name: instance_count, type: u32}
      - {name: first_index, type: u32}
      - {name: vertex_offset, type: i32}
      - {name: first_instance, type: u32}

  dispatch_indirect_args:
    doc: The workgroups of one indirect dispatch, for bfr_dispatch_indirect.
    members:
      - {name: x, type: u32}
      - {name: y, type: u32}
      - {name: z, type: u32}

  buffer_copy:
    doc: One range copied from a source buffer to a destination buffer.
    members:
      - {name: src_offset, type: u64, doc: Bytes into the source.}
      - {name: dst_offset, type: u64, doc: Bytes into the destination.}
      - {name: size, type: u64, doc: Bytes.}

  texture_usage:
    doc: What the GPU does with a texture. Set every use it will have.
    members:
      - {name: copy_src, type: bool}
      - {name: copy_dst, type: bool}
      - {name: sampled, type: bool, doc: Shaders sample it.}
      - {name: storage, type: bool, doc: Shaders read and write it.}
      - {name: color_attachment, type: bool, doc: Rendering writes color to it.}
      - {name: depth_stencil, type: bool, doc: Rendering tests and writes depth or stencil in it.}

  texture_desc:
    doc: >-
      How to create a texture, in device memory. The CPU reaches it only by
      copies through a buffer. More than one layer, or more than 6 for cube,
      makes an array texture, which shaders declare as one.
    extensible: true
    members:
      - {name: dimension, type: texture_dimension, doc: 0 is d2.}
      - {name: format, type: format}
      - {name: width, type: u32, doc: Texels.}
      - {name: height, type: u32, doc: Texels; 1 for d1.}
      - {name: depth, type: u32, doc: Texels for d3; 1 otherwise.}
      - {name: layers, type: u32, doc: "1 for d3; for cube, a multiple of 6."}
      - {name: mip_levels, type: u32}
      - {name: samples, type: u32, doc: Samples per texel; 1 unless rendering multisamples it.}
      - {name: usage, type: texture_usage}
      - {name: sparse, type: bool, doc: "Made with no memory: bfr_update_tile_mappings maps sparse memory's tiles into it, as bfr_caps_sparse and bfr_get_sparse_format say."}
      - {name: sparse_aliased, type: bool, doc: "Its tiles may be mapped to memory other sparse resources' tiles are mapped to, where bfr_caps_sparse.aliased."}
      - {name: tile_bytes, type: u32, doc: "One of bfr_caps_sparse.tile_bytes, or 0 where that list is empty; only when sparse."}

  timestamp_pool_desc:
    doc: How to create a timestamp pool.
    members:
      - {name: queue, type: u32, doc: "The device's queue whose lists write it, numbered as bfr_device_desc says."}
      - {name: count, type: u32, doc: How many timestamps it holds.}

  timestamp_rate:
    doc: >-
      How long a timestamp tick lasts, in the unit the backend gives: a period
      in nanoseconds or a frequency in ticks per second. The other is 0.
    members:
      - {name: period_ns, type: f32}
      - {name: frequency, type: u64}

  pipeline_statistics_mask:
    doc: The statistics a pipeline_statistics pool counts. Task and mesh invocations where bfr_caps_features.mesh_statistics.
    members:
      - {name: input_vertices, type: bool}
      - {name: input_primitives, type: bool}
      - {name: vertex_invocations, type: bool}
      - {name: geometry_invocations, type: bool}
      - {name: geometry_primitives, type: bool}
      - {name: clip_invocations, type: bool}
      - {name: clip_primitives, type: bool}
      - {name: fragment_invocations, type: bool}
      - {name: tessellation_control, type: bool}
      - {name: tessellation_evaluation_invocations, type: bool}
      - {name: compute_invocations, type: bool}
      - {name: task_invocations, type: bool}
      - {name: mesh_invocations, type: bool}

  query_pool_desc:
    doc: How to create a query pool.
    members:
      - {name: type, type: query_type, doc: What its queries count.}
      - {name: count, type: u32, doc: How many queries it holds.}
      - {name: statistics, type: pipeline_statistics_mask, doc: Read only for pipeline_statistics.}

  debug_label:
    doc: >-
      A name a debugger or profiler shows on a region of a list's or a queue's
      work, or on one point in it.
    members:
      - {name: name, type: string, doc: "Read during the call only."}
      - {name: color, type: f32, fixed: 4, doc: "Red, green, blue and alpha, 0 to 1, passed to the backend as given."}

  query_layout:
    doc: >-
      Where a pool's results land in the buffer bfr_resolve_queries writes, as
      the backend lays them out: stride bytes for each query, and in each, the
      64-bit value of an occlusion or mesh_primitives_generated query at
      value, and each statistic of a pipeline_statistics query at its offset,
      indexed by bfr_pipeline_statistic. BFR_NO_OFFSET where the results hold
      no such value.
    members:
      - {name: stride, type: u32}
      - {name: value, type: u32}
      - {name: statistics, type: u32, fixed: pipeline_statistic_count}

  calibrated_timestamps:
    doc: >-
      A GPU timestamp and a host clock's reading taken together, so GPU ticks
      can be placed on the host's timeline.
    members:
      - {name: gpu, type: u64}
      - {name: host, type: u64}
      - {name: max_deviation_ns, type: u64, doc: "How far apart the two readings may be, where deviation_given."}
      - {name: deviation_given, type: bool, doc: The backend gave max_deviation_ns.}

  call_timing:
    doc: >-
      The CPU time one kind of call has taken, read from std::chrono::steady_clock
      around each call: how many there were, their nanoseconds in all, and the
      longest one's.
    members:
      - {name: count, type: u64}
      - {name: total_ns, type: u64}
      - {name: max_ns, type: u64}

  buffer_slots:
    doc: >-
      Where a buffer is in the bindless tables bfr_pipeline states, from
      creation to destruction: the index shaders use. A table the buffer's
      usage does not set has no slot for it, and reads BFR_NO_SLOT.
    members:
      - {name: storage, type: u32, doc: Its index in the storage buffer table; only with storage usage.}
      - {name: uniform, type: u32, doc: Its index in the uniform buffer table; only with uniform usage.}

  texture_slots:
    doc: >-
      Where a texture is in the bindless tables bfr_pipeline states, from
      creation to destruction: the index shaders use. A table the texture's
      usage does not set has no slot for it, and reads BFR_NO_SLOT.
    members:
      - {name: sampled, type: u32, doc: Its index in the texture table; only with sampled usage.}
      - {name: storage, type: u32, doc: Its index in the storage texture table; only with storage usage.}

  texture_range:
    doc: >-
      The mip levels and layers of a texture a barrier moves: mip_count levels
      from mip_level, and layer_count layers from layer, in every plane.
      Counts pass through as given; 0 is no count Vulkan takes. A 3D texture
      has one layer, so a barrier moves every depth slice of its levels.
    members:
      - {name: mip_level, type: u32}
      - {name: mip_count, type: u32, default: remaining}
      - {name: layer, type: u32}
      - {name: layer_count, type: u32, default: remaining}

  buffer_texture_copy:
    doc: >-
      One region copied between a buffer and one layer and mip level of a
      single-sampled texture. bytes_per_row is a multiple of the format's
      block bytes and, when it is not 0, of
      bfr_caps_limits.copy_row_pitch_alignment; buffer_offset a multiple of
      the block bytes and, when it is not 0, of copy_offset_alignment.
      rows_per_image is at least height and a multiple of the block height. A
      depth or stencil aspect copies its whole mip level, with buffer_offset a
      multiple of 4, and takes 4 bytes a texel for depth, 2 for a 16-bit
      depth, and 1 for stencil.
    members:
      - {name: buffer_offset, type: u64, doc: Bytes into the buffer.}
      - {name: bytes_per_row, type: u64, doc: Bytes between the starts of two rows of texel blocks in the buffer.}
      - {name: rows_per_image, type: u32, doc: Rows of texels between the starts of two depth slices in the buffer.}
      - {name: mip_level, type: u32}
      - {name: layer, type: u32}
      - {name: aspect, type: texture_aspect}
      - {name: x, type: u32}
      - {name: y, type: u32}
      - {name: z, type: u32}
      - {name: width, type: u32, doc: Texels.}
      - {name: height, type: u32, doc: Texels.}
      - {name: depth, type: u32, doc: Texels.}

  texture_copy:
    doc: >-
      One region copied between two textures of one format and sample count,
      from one layer and mip level to another, every aspect of it. A
      depth-stencil or multisampled texture copies its whole mip level.
    members:
      - {name: src_mip_level, type: u32}
      - {name: src_layer, type: u32}
      - {name: src_x, type: u32}
      - {name: src_y, type: u32}
      - {name: src_z, type: u32}
      - {name: dst_mip_level, type: u32}
      - {name: dst_layer, type: u32}
      - {name: dst_x, type: u32}
      - {name: dst_y, type: u32}
      - {name: dst_z, type: u32}
      - {name: width, type: u32, doc: Texels.}
      - {name: height, type: u32, doc: Texels.}
      - {name: depth, type: u32, doc: Texels.}

  sampler_desc:
    doc: >-
      How to create a sampler. Every member reaches the backend as it is;
      the backend's rules for them hold, such as Vulkan's for unnormalized
      coordinates: min and mag filter equal, mip filter nearest, both LODs 0,
      U and V clamp, no anisotropy and no compare.
    extensible: true
    members:
      - {name: mag_filter, type: filter, doc: 0 is nearest.}
      - {name: min_filter, type: filter}
      - {name: mip_filter, type: filter}
      - {name: address_u, type: address_mode, doc: 0 is repeat.}
      - {name: address_v, type: address_mode}
      - {name: address_w, type: address_mode}
      - {name: lod_bias, type: f32, doc: "Added to the LOD; other than 0 needs bfr_caps_features.sampler_lod_bias."}
      - {name: min_lod, type: f32}
      - {name: max_lod, type: f32, doc: 0 samples mip 0 only.}
      - {name: max_anisotropy, type: u32, doc: "0 is none; up to bfr_caps_limits.max_sampler_anisotropy."}
      - {name: reduction, type: sampler_reduction}
      - {name: compare_op, type: compare_op, doc: With reduction compare.}
      - name: border_color
        type: f32
        fixed: 4
        doc: >-
          Red, green, blue and alpha a clamp_to_border read returns; all 0 is
          transparent black. Other than (0,0,0,0), (0,0,0,1) and (1,1,1,1) needs
          bfr_caps_features.sampler_custom_border_color.
      - {name: border_integer, type: bool, doc: "The texture holds integers: border_color_integer applies instead; bfr_caps_features.sampler_integer_border_color."}
      - {name: border_color_integer, type: u32, fixed: 4, doc: "Red, green, blue and alpha bits; a signed format reads them as int32."}
      - {name: unnormalized_coordinates, type: bool, doc: "Coordinates in texels, not 0 to 1; bfr_caps_features.sampler_unnormalized_coordinates."}
      - {name: lod_average, type: bool, doc: The LOD averaged across a quad; bfr_caps_features.sampler_lod_average.}

  shader_code:
    doc: >-
      One shader stage: bytecode for the backend the device runs on, and the
      name of the function in it to run.
    members:
      - {name: code, type: u8, array: code_size, pointer: in, doc: Read during the call only.}
      - {name: code_size, type: size, doc: Bytes.}
      - {name: entry_point, type: string}

  raster_state:
    doc: How a graphics pipeline turns primitives into fragments.
    members:
      - {name: cull, type: cull_mode}
      - {name: front_face, type: front_face}
      - {name: fill, type: fill_mode}
      - {name: depth_clamp, type: bool, doc: "Clamps depth to the viewport's range instead of clipping to it."}
      - {name: depth_bias, type: f32, doc: "Added to each fragment's depth, in units of the depth format's smallest step. D3D12 takes whole numbers only, so there a fraction fails with BFR_RESULT_ERROR_INVALID_ARGUMENT."}
      - {name: depth_bias_slope, type: f32, doc: "Added to each fragment's depth, times its depth slope."}
      - {name: depth_bias_clamp, type: f32, doc: The most the bias may add; 0 is no limit.}

  stencil_face:
    doc: The stencil test for triangles facing one way.
    members:
      - {name: fail, type: stencil_op, doc: When the stencil test fails.}
      - {name: pass, type: stencil_op, doc: When the stencil and depth tests pass.}
      - {name: depth_fail, type: stencil_op, doc: When the stencil test passes and the depth test fails.}
      - {name: compare, type: compare_op, doc: Reference value against stored.}
      - {name: read_mask, type: u32, doc: The bits compared. The low 8 bits count.}
      - {name: write_mask, type: u32, doc: The bits written. The low 8 bits count.}

  depth_stencil_state:
    doc: >-
      How a graphics pipeline tests depth and stencil. Off by default; the
      pipeline then needs no depth-stencil target.
    members:
      - {name: depth_test, type: bool}
      - {name: depth_write, type: bool, doc: Fragments that pass write their depth.}
      - {name: depth_compare, type: compare_op, doc: New depth against stored.}
      - {name: stencil_test, type: bool}
      - {name: front, type: stencil_face}
      - {name: back, type: stencil_face}

  blend_state:
    doc: >-
      How a graphics pipeline blends a fragment into one color target. With
      enable false the fragment's color replaces the target's, in the channels
      write_mask names.
    members:
      - {name: enable, type: bool}
      - {name: src_color, type: blend_factor}
      - {name: dst_color, type: blend_factor}
      - {name: color_op, type: blend_op}
      - {name: src_alpha, type: blend_factor}
      - {name: dst_alpha, type: blend_factor}
      - {name: alpha_op, type: blend_op}
      - name: write_mask
        type: u32
        doc: "Which channels are written: bit 0 red, 1 green, 2 blue, 3 alpha. Bits above 3 are ignored."

  color_target:
    doc: One color target a graphics pipeline renders to.
    members:
      - {name: format, type: format}
      - {name: blend, type: blend_state}

  ray_tracing_shader:
    doc: One shader of a ray tracing pipeline, run at stage.
    members:
      - {name: stage, type: ray_tracing_stage}
      - {name: shader, type: shader}

  ray_tracing_group:
    doc: >-
      Shaders, by index into the pipeline's shaders, that a binding table
      record names by its group's identifier; no_shader is none.
    members:
      - {name: type, type: ray_tracing_group_type}
      - {name: general, type: u32}
      - {name: closest_hit, type: u32}
      - {name: any_hit, type: u32}
      - {name: intersection, type: u32}

  ray_tracing_pipeline_desc:
    doc: >-
      How to create a ray tracing pipeline: at least one ray generation
      shader, its own or a library's. max_payload_size and max_attribute_size
      are the largest payload and hit attributes its shaders declare, passed
      to backends that take them. Rays trace recursively to
      max_recursion_depth, at most bfr_caps_ray_tracing's; at 0 ray generation
      traces none. With library, it is a pipeline library, where
      bfr_caps_features.ray_tracing_pipeline_library: never bound, only linked
      into pipelines that name it in libraries. A linked library's shaders and
      groups follow the pipeline's own, in the order libraries names them, so
      group indices count on past its groups; each library was made with the
      same max_recursion_depth, max_payload_size and max_attribute_size, and
      with capture_replay where the pipeline is.
    extensible: true
    members:
      - {name: shaders, type: ray_tracing_shader, array: shader_count, pointer: in, optional: true, doc: Read during the call only.}
      - {name: shader_count, type: u32}
      - {name: groups, type: ray_tracing_group, array: group_count, pointer: in, optional: true, doc: Read during the call only.}
      - {name: group_count, type: u32}
      - {name: max_recursion_depth, type: u32}
      - {name: max_payload_size, type: u32}
      - {name: max_attribute_size, type: u32}
      - {name: cache, type: pipeline_cache, doc: "Where the pipeline is looked for, and added on a miss; null is none."}
      - name: stack_size
        type: u64
        doc: >-
          The bytes of stack its traces take, large enough for every trace it
          makes (bfr_get_ray_tracing_stack_size gives each shader's); 0 leaves
          the backend's own size.
      - {name: library, type: bool}
      - {name: libraries, type: pipeline, array: library_count, pointer: in, optional: true, doc: Read during the call only.}
      - {name: library_count, type: u32}
      - name: capture_replay
        type: bool
        doc: >-
          Its groups' identifiers may be captured, by
          bfr_get_capture_replay_identifiers, and replayed, where
          bfr_caps_features.ray_tracing_capture_replay.
      - name: replay_identifiers
        type: u8
        array: replay_identifiers_size
        pointer: in
        optional: true
        doc: >-
          None, or the identifiers bfr_get_capture_replay_identifiers gave for
          every group of groups, in order,
          bfr_caps_ray_tracing.capture_replay_identifier_size bytes each, of a
          pipeline made from the same desc: its groups then have the
          identifiers that pipeline's had. With capture_replay. Where
          bfr_caps_features.ray_tracing_capture_replay_mixed is false, a device
          makes none with them unless its first ray tracing pipeline had them,
          and none with them while it makes one without. Read during the call
          only.
      - {name: replay_identifiers_size, type: size, doc: Bytes.}
      - {name: allow_opacity_micromaps, type: bool, doc: "Its traces take the opacity micromaps structures hold, where bfr_caps_features.opacity_micromap."}
      - {name: allow_motion, type: bool, doc: "Its traces are at a time, of structures with motion, where bfr_caps_features.ray_tracing_motion."}
      - {name: allow_clusters, type: bool, doc: "Its traces may reach cluster bottom structures, which they must be made with to, where bfr_caps_features.cluster_acceleration_structure."}

  shader_table_region:
    doc: >-
      Records in a shader binding table: size bytes from offset in buffer,
      which has shader_binding_table usage, stride bytes apart. offset is a
      multiple of bfr_caps_ray_tracing.table_alignment, stride of
      identifier_alignment and at most max_shader_group_stride. A null buffer
      is no region.
    members:
      - {name: buffer, type: buffer}
      - {name: offset, type: u64}
      - {name: size, type: u64}
      - {name: stride, type: u64}

  trace_rays_desc:
    doc: >-
      width by height by depth rays, within bfr_caps_ray_tracing.max_trace_rays
      and bfr_caps_compute's max_workgroup_count times max_workgroup_size in
      each dimension. ray_generation is given, one record, its size equal to
      its stride.
    members:
      - {name: ray_generation, type: shader_table_region}
      - {name: miss, type: shader_table_region}
      - {name: hit, type: shader_table_region}
      - {name: callable, type: shader_table_region}
      - {name: width, type: u32}
      - {name: height, type: u32}
      - {name: depth, type: u32}

  shader_table_address_region:
    doc: A region of a shader binding table by bfr_get_buffer_address, as bfr_trace_rays_indirect_args holds it.
    members:
      - {name: address, type: u64}
      - {name: size, type: u64}
      - {name: stride, type: u64}

  trace_rays_indirect_args:
    doc: >-
      One indirect trace, as a buffer holds it for bfr_trace_rays_indirect:
      bfr_trace_rays_desc's regions by address. The layout every backend reads.
    members:
      - {name: ray_generation_address, type: u64}
      - {name: ray_generation_size, type: u64}
      - {name: miss, type: shader_table_address_region}
      - {name: hit, type: shader_table_address_region}
      - {name: callable, type: shader_table_address_region}
      - {name: width, type: u32}
      - {name: height, type: u32}
      - {name: depth, type: u32}

  compute_pipeline_desc:
    doc: How to create a compute pipeline.
    extensible: true
    members:
      - {name: compute, type: shader_code}
      - name: workgroup_size
        type: u32
        fixed: 3
        doc: Threads in each workgroup, as the shader declares them; a dispatch counts workgroups.
      - {name: cache, type: pipeline_cache, doc: "Where the pipeline is looked for, and added on a miss; null is none."}

  graphics_pipeline_desc:
    doc: >-
      How to create a graphics pipeline. Vertices are pulled: the vertex
      shader reads them by index from buffers; the pipeline takes no vertex
      layout.
    extensible: true
    members:
      - {name: vertex, type: shader_code}
      - {name: fragment, type: shader_code, doc: A code_size of 0 is no fragment shader; the pipeline writes depth alone.}
      - name: task
        type: shader_code
        doc: >-
          Task and mesh shaders in place of vertices: with a mesh shader, the
          pipeline draws by bfr_draw_mesh, vertex has a code_size of 0, and
          topology and primitive_restart are unused. It needs
          bfr_caps_features.mesh_shader, and a task shader
          bfr_caps_features.task_shader; a code_size of 0 is none. With a task
          shader, the mesh shader reads no draw index.
      - {name: task_workgroup_size, type: u32, fixed: 3, doc: "Threads in each task workgroup, as the shader declares them."}
      - {name: mesh, type: shader_code}
      - {name: mesh_workgroup_size, type: u32, fixed: 3, doc: "Threads in each mesh workgroup, as the shader declares them."}
      - {name: topology, type: topology, doc: What its draws assemble until bfr_set_topology.}
      - {name: primitive_restart, type: primitive_restart}
      - {name: raster, type: raster_state}
      - {name: depth_stencil, type: depth_stencil_state}
      - {name: color_target_count, type: u32, doc: "How many of color_targets are used, at most max_color_targets."}
      - {name: color_targets, type: color_target, fixed: max_color_targets, doc: "The targets the pipeline renders to, in attachment order."}
      - {name: depth_stencil_format, type: format, doc: undefined is no depth-stencil target.}
      - {name: samples, type: u32, doc: Samples per pixel of every target; 1 is no multisampling.}
      - {name: alpha_to_coverage, type: bool, doc: The fragment's alpha sets how many samples it covers.}
      - {name: sample_mask, type: u64, doc: "The samples written, bit i for sample i; bits from samples up are ignored. Leaving one of the low samples bits clear needs bfr_caps_features.sample_mask."}
      - {name: alpha_to_one, type: bool, doc: "The fragment's alpha becomes 1 after coverage is taken from it, where bfr_caps_features.alpha_to_one."}
      - {name: min_sample_shading, type: f32, doc: "The fraction of samples, 0 to 1, shaded apart; above 0 shades per sample, where bfr_caps_features.sample_rate_shading."}
      - {name: cache, type: pipeline_cache, doc: "Where the pipeline is looked for, and added on a miss; null is none."}

  pipeline_cache_desc:
    doc: How to create a pipeline cache.
    members:
      - {name: data, type: u8, array: data_size, pointer: in, doc: "Bytes bfr_get_pipeline_cache_data gave before, read during the call only."}
      - {name: data_size, type: size, doc: Bytes; 0 is an empty cache.}

  token:
    doc: >-
      A point on a queue's timeline, which bfr_submit writes and the GPU passes
      once what was submitted has run. An all-zero token has already completed.
    members:
      - {name: queue, type: u32, doc: "Index of the queue on the device, numbered as bfr_device_desc says."}
      - {name: value, type: u64}

  submit_desc:
    doc: What to send to a queue.
    extensible: true
    members:
      - {name: queue, type: u32, doc: "The queue to send to, numbered as bfr_device_desc says."}
      - name: command_lists
        type: command_list
        array: command_list_count
        pointer: in
        doc: Recorded from pools on the same queue; the GPU runs them in this order.
      - {name: command_list_count, type: u32}
      - name: waits
        type: token
        array: wait_count
        pointer: in
        optional: true
        doc: The GPU passes these before it runs the lists.
      - {name: wait_count, type: u32}

  sparse_memory_desc:
    doc: >-
      How to create sparse memory, for the tiles of resources like texture
      and buffer, either of which may be null but not both: Vulkan takes the
      memory's type from their requirements, and D3D12, where
      bfr_caps_sparse.mixed_resources is false, the one kind of resource its
      heap holds. A resource mapped to it later must take what they took, as
      each backend says.
    members:
      - {name: size, type: u64, doc: Bytes.}
      - {name: tile_bytes, type: u32, doc: "One of bfr_caps_sparse.tile_bytes, or 0 where that list is empty."}
      - {name: texture, type: texture}
      - {name: buffer, type: buffer}

  tile_shape:
    doc: A tile's size, in texels.
    members:
      - {name: width, type: u32}
      - {name: height, type: u32}
      - {name: depth, type: u32}

  texture_tiling:
    doc: >-
      How one aspect of a sparse texture is cut into tiles, as the backend
      says. Mip levels from first_tail_mip on are its tail, mapped as tiles of
      tail_bytes rather than by region.
    members:
      - {name: tile_bytes, type: u64, doc: Bytes in one tile.}
      - {name: shape, type: tile_shape}
      - {name: first_tail_mip, type: u32}
      - {name: tail_bytes, type: u64, doc: Bytes of one layer's tail.}
      - {name: tail_stride, type: u64, doc: "Bytes between the starts of two layers' tails; 0 where the backend gives none."}
      - {name: single_tail, type: bool, doc: "Every layer shares one tail, mapped at layer 0."}

  buffer_tiling:
    doc: How a sparse buffer is cut into tiles.
    members:
      - {name: tile_bytes, type: u64, doc: Bytes in one tile.}

  sparse_format_desc:
    doc: The texture a bfr_get_sparse_format call asks about, as bfr_texture_desc would make it.
    members:
      - {name: format, type: format}
      - {name: dimension, type: texture_dimension}
      - {name: samples, type: u32}
      - {name: usage, type: texture_usage}
      - {name: aspect, type: texture_aspect}
      - {name: tile_bytes, type: u32, doc: As bfr_texture_desc.tile_bytes.}

  sparse_format:
    doc: Whether a sparse texture of a format can be made, and its tiles' shape.
    members:
      - {name: supported, type: bool}
      - {name: shape, type: tile_shape}
      - {name: single_tail, type: bool, doc: Every layer shares one tail.}
      - {name: aligned_mip_size, type: bool, doc: Every mip level not a whole number of tiles is in the tail.}

  texture_tile_region:
    doc: >-
      One region of a sparse texture mapped to memory or unmapped. Below the
      tail the region is x, y, z, width, height and depth, in tiles of the mip
      level; from bfr_texture_tiling.first_tail_mip on, it is tail_tiles tiles
      from tail_tile in the layer's tail. memory_tile is where in memory, in
      the texture's tiles.
    members:
      - {name: mapping, type: tile_mapping, doc: 0 is map.}
      - {name: aspect, type: texture_aspect}
      - {name: mip_level, type: u32}
      - {name: layer, type: u32}
      - {name: x, type: u32}
      - {name: y, type: u32}
      - {name: z, type: u32}
      - {name: width, type: u32}
      - {name: height, type: u32}
      - {name: depth, type: u32}
      - {name: tail_tile, type: u64}
      - {name: tail_tiles, type: u64}
      - {name: memory_tile, type: u64}

  buffer_tile_region:
    doc: >-
      tiles tiles of a sparse buffer from tile mapped to memory from
      memory_tile, or unmapped, in the buffer's tiles.
    members:
      - {name: mapping, type: tile_mapping, doc: 0 is map.}
      - {name: tile, type: u64}
      - {name: tiles, type: u64}
      - {name: memory_tile, type: u64}

  tile_mapping_desc:
    doc: >-
      What bfr_update_tile_mappings sends to one queue: texture_regions of
      texture and buffer_regions of buffer mapped to memory or unmapped.
    extensible: true
    members:
      - {name: queue, type: u32, doc: "The queue to map on, numbered as bfr_device_desc says."}
      - {name: waits, type: token, array: wait_count, pointer: in, optional: true, doc: Tokens the GPU passes before it maps.}
      - {name: wait_count, type: u32}
      - {name: memory, type: sparse_memory, doc: Null when every region unmaps.}
      - {name: texture, type: texture, doc: Null for none.}
      - {name: texture_regions, type: texture_tile_region, array: texture_region_count, pointer: in, optional: true}
      - {name: texture_region_count, type: u32}
      - {name: buffer, type: buffer, doc: Null for none.}
      - {name: buffer_regions, type: buffer_tile_region, array: buffer_region_count, pointer: in, optional: true}
      - {name: buffer_region_count, type: u32}

  acceleration_structure_flags:
    doc: How an acceleration structure is built.
    members:
      - {name: preference, type: build_preference, doc: 0 is none.}
      - {name: allow_update, type: bool, doc: Later builds may update the structure.}
      - {name: minimize_memory, type: bool}
      - {name: allow_compaction, type: bool, doc: "bfr_compact_acceleration_structure may copy it, and its compacted_size be written."}
      - {name: allow_data_access, type: bool, doc: "Shaders read its triangles' positions, where bfr_caps_features.ray_position_fetch."}
      - {name: allow_opacity_micromap_update, type: bool, doc: "Of a bottom structure with opacity micromaps, where bfr_caps_features.opacity_micromap: updates may name other micromaps."}
      - {name: allow_disable_opacity_micromaps, type: bool, doc: Instances may disable its opacity micromaps.}
      - {name: allow_opacity_micromap_data_update, type: bool, doc: "Updates may follow its opacity micromaps' data."}

  opacity_micromap_usage:
    doc: count micromaps, or triangles naming micromaps, of subdivision_level and format.
    members:
      - {name: count, type: u32}
      - {name: subdivision_level, type: u32}
      - {name: format, type: opacity_micromap_format}

  opacity_micromap_record:
    doc: >-
      One micromap, as a buffer holds it for an opacity micromap's build: its
      states from data_offset bytes into the build's data, of
      subdivision_level and format (a bfr_opacity_micromap_format's value).
      The layout every backend reads.
    members:
      - {name: data_offset, type: u32}
      - {name: subdivision_level, type: u16}
      - {name: format, type: u16}

  triangle_opacity_micromap:
    doc: >-
      The micromaps a triangle geometry's triangles take their opacity from:
      triangle i's is the micromap at the index read from indices (a null
      indices is i), index_stride bytes apart from index_offset, plus
      base_triangle, or a bfr_opacity_micromap_special_index. A null micromap
      is none, where every index is special. usage_count usages from
      first_usage in the inputs' micromap_usages count the geometry's
      triangles of each subdivision level and format, passed to backends that
      take them. None where micromap and indices are both null.
    members:
      - {name: micromap, type: acceleration_structure}
      - {name: indices, type: buffer}
      - {name: index_offset, type: u64, doc: Bytes into indices.}
      - {name: index_type, type: index_type}
      - {name: index_stride, type: u32}
      - {name: base_triangle, type: u32}
      - {name: first_usage, type: u32}
      - {name: usage_count, type: u32}

  triangle_geometry:
    doc: >-
      Triangles in a bottom acceleration structure. A null indices is none:
      triangle_count * 3 vertices are read in order. A null transform is none;
      else a 3x4 row-major float matrix at transform_offset, a multiple of 16.
      vertex_format is one bfr_format_caps.acceleration_structure_vertices is
      true for; vertex_offset and vertex_stride are multiples of its component
      size, index_offset of the index size. The buffers have
      acceleration_structure_input usage.
    members:
      - {name: vertices, type: buffer}
      - {name: vertex_offset, type: u64, doc: Bytes into vertices.}
      - {name: vertex_format, type: format}
      - {name: vertex_stride, type: u32, doc: Bytes between two vertices.}
      - {name: vertex_count, type: u32}
      - {name: indices, type: buffer}
      - {name: index_offset, type: u64, doc: Bytes into indices.}
      - {name: index_type, type: index_type}
      - {name: triangle_count, type: u32}
      - {name: transform, type: buffer}
      - {name: transform_offset, type: u64, doc: Bytes into transform.}
      - {name: opaque, type: bool}
      - {name: no_duplicate_any_hit, type: bool}
      - {name: opacity_micromap, type: triangle_opacity_micromap, doc: "Where bfr_caps_features.opacity_micromap."}
      - name: motion_vertices
        type: buffer
        doc: >-
          In a structure with motion, the vertices at each keyframe after the
          first, which vertices holds: keyframe k's from motion_vertex_offset +
          (k - 1) * motion_keyframe_stride, laid out as vertices are. Read
          only where the inputs' motion_keyframes is not 0. It has
          acceleration_structure_input usage.
      - {name: motion_vertex_offset, type: u64, doc: Bytes into motion_vertices.}
      - {name: motion_keyframe_stride, type: u64, doc: Bytes from one keyframe's vertices to the next.}

  box_geometry:
    doc: >-
      Boxes in a bottom acceleration structure: six floats each, min xyz then
      max xyz, min at most max, stride bytes apart; offset and stride
      multiples of 8. The buffer has acceleration_structure_input usage.
    members:
      - {name: boxes, type: buffer}
      - {name: offset, type: u64, doc: Bytes into boxes.}
      - {name: stride, type: u32}
      - {name: count, type: u32}
      - {name: opaque, type: bool}
      - {name: no_duplicate_any_hit, type: bool}

  partitioned_top_op:
    doc: >-
      One kind of work in a partitioned top structure's build, as a buffer
      holds it: count records of type (a bfr_partitioned_top_op_type's value),
      stride bytes apart from address, a bfr_get_buffer_address plus an
      offset. No two of a build's ops are of one type, and no instance is named
      twice in one. The layout the backend reads.
    members:
      - {name: type, type: u32}
      - {name: count, type: u32}
      - {name: address, type: u64}
      - {name: stride, type: u64}

  partitioned_instance_record:
    doc: >-
      A write_instance record: instance instance_index, below the structure's
      instance_count, of bottom_reference
      (bfr_get_acceleration_structure_reference; 0 is an instance no ray hits,
      which Vulkan may keep so), in partition partition_index, below its
      partition_count, or global_partition. hit_group_offset is below
      instance_index_limit and mask is 8 bits. The layout the backend reads.
    members:
      - {name: transform, type: f32, fixed: transform_floats, doc: 3x4 row-major object-to-world transform.}
      - name: bounds
        type: f32
        fixed: box_floats
        doc: >-
          Read with explicit_bounds: the bottom structures it will name,
          transformed, before any partition translation.
      - {name: custom_index, type: u32}
      - {name: mask, type: u32}
      - {name: hit_group_offset, type: u32}
      - {name: flags, type: u32, doc: ORs bfr_partitioned_instance_flag values.}
      - {name: instance_index, type: u32}
      - {name: partition_index, type: u32}
      - {name: bottom_reference, type: u64}

  partitioned_instance_update_record:
    doc: >-
      An update_instance record: instance instance_index, written with
      explicit_bounds or with a bottom_reference of 0, takes bottom_reference,
      within its bounds, or 0, which disables it, and hit_group_offset, below
      instance_index_limit. One written with 0 may stay disabled, as Vulkan
      says. The layout the backend reads.
    members:
      - {name: instance_index, type: u32}
      - {name: hit_group_offset, type: u32}
      - {name: bottom_reference, type: u64}

  partition_translation_record:
    doc: >-
      A write_partition_translation record: partition partition_index, below
      its partition_count, or global_partition, of a structure built with
      partition_translation, is traced as if translation were added to its
      instances' transforms. The layout the backend reads.
    members:
      - {name: partition_index, type: u32}
      - {name: translation, type: f32, fixed: 3}

  partitioned_top_inputs:
    doc: >-
      A partitioned top structure's counts and work: instance_count instances,
      in partition_count partitions of at most max_partition_instances each
      and the global partition of at most max_global_instances,
      partition_count plus max_global_instances at most
      bfr_caps_ray_tracing.max_partitions; with partition_translation,
      partitions may be moved. A build runs the bfr_partitioned_top_op records
      from op_offset in ops, as many as the GPU reads from the u32 at
      op_count_offset, a multiple of 4, in op_count; both buffers are given,
      with acceleration_structure_input usage. bfr_get_acceleration_structure_sizes
      reads the flags, the counts and partition_translation.
    members:
      - {name: instance_count, type: u32}
      - {name: max_partition_instances, type: u32}
      - {name: partition_count, type: u32}
      - {name: max_global_instances, type: u32}
      - {name: partition_translation, type: bool}
      - {name: ops, type: buffer}
      - {name: op_offset, type: u64, doc: Bytes into ops.}
      - {name: op_count, type: buffer}
      - {name: op_count_offset, type: u64, doc: Bytes into op_count.}

  cluster_triangle_limits:
    doc: >-
      The upper bounds a cluster operation of clusters or templates is sized
      for: vertices of vertex_format, geometry indices to max_geometry_index,
      at most max_unique_geometries of them, max_triangles triangles and
      max_vertices vertices in each, at most
      bfr_caps_ray_tracing.max_cluster_triangles and max_cluster_vertices,
      max_total_triangles and max_total_vertices in all, and no record
      truncating fewer than min_truncate_bits position bits, at most 32.
    members:
      - {name: vertex_format, type: format}
      - {name: max_geometry_index, type: u32}
      - {name: max_unique_geometries, type: u32}
      - {name: max_triangles, type: u32}
      - {name: max_vertices, type: u32}
      - {name: max_total_triangles, type: u32}
      - {name: max_total_vertices, type: u32}
      - {name: min_truncate_bits, type: u32}

  cluster_bottom_limits:
    doc: >-
      The upper bounds a build_bottoms is sized for: max_total_clusters
      clusters in all, max_clusters_per_bottom in each bottom structure.
    members:
      - {name: max_total_clusters, type: u32}
      - {name: max_clusters_per_bottom, type: u32}

  cluster_move_limits:
    doc: >-
      What a move moves, and at most max_bytes of it; with no_overlap, no
      destination overlaps a source, which stays valid, as after a copy.
    members:
      - {name: type, type: cluster_structure_type, doc: 0 is bottom.}
      - {name: no_overlap, type: bool}
      - {name: max_bytes, type: u64}

  cluster_inputs:
    doc: >-
      A cluster operation's kind, mode and upper bounds: at most max_count
      structures, built with flags as other structures are; with
      allow_opacity_micromaps, clusters may name opacity micromaps. The
      bounds the operation reads: move for move, bottoms for build_bottoms,
      triangles for the rest.
    members:
      - {name: operation, type: cluster_operation, doc: 0 is move.}
      - {name: mode, type: cluster_mode, doc: 0 is implicit_destinations.}
      - {name: flags, type: acceleration_structure_flags}
      - {name: allow_opacity_micromaps, type: bool}
      - {name: max_count, type: u32}
      - {name: move, type: cluster_move_limits}
      - {name: bottoms, type: cluster_bottom_limits}
      - {name: triangles, type: cluster_triangle_limits}

  cluster_indirection:
    doc: >-
      Which of a bfr_cluster_build's regions hold, at their offset, the
      address of the data rather than the data, which the GPU reads as it
      runs.
    members:
      - {name: destination, type: bool}
      - {name: scratch, type: bool}
      - {name: addresses, type: bool}
      - {name: sizes, type: bool}
      - {name: records, type: bool}
      - {name: count, type: bool}

  cluster_build:
    doc: >-
      A cluster operation, from inputs: the records of its kind from
      record_offset in records, record_stride bytes apart (0 packed), as many
      as the u32 at count_offset, a multiple of 4, in count, or with no count
      max_count, never more than max_count; records and count have
      acceleration_structure_input usage. implicit_destinations packs the
      structures from destination_offset in destination, which has
      acceleration_structure_storage usage and at least the size query's size
      bytes, or for a move the bytes moved, and writes their addresses to
      addresses and their sizes to sizes, where given;
      explicit_destinations reads each structure's address from addresses,
      each in a buffer with acceleration_structure_storage usage, and its size
      from sizes, where given; compute_sizes writes each structure's size to
      sizes. Each destination is a multiple of
      bfr_caps_ray_tracing.cluster_alignment for clusters,
      cluster_template_alignment for templates and cluster_bottom_alignment
      for bottom structures. addresses holds 8-byte addresses address_stride
      bytes apart, at least 8, and has storage usage; sizes holds 4-byte
      sizes size_stride bytes apart, at least 4. Each of addresses, sizes and
      records is read or written within its buffer, from its offset. Scratch is scratch_offset bytes into scratch, which has
      acceleration_structure_scratch usage, at least the size query's
      build_scratch bytes, a multiple of
      bfr_caps_ray_tracing.cluster_scratch_alignment, and overlaps no
      destination.
    members:
      - {name: inputs, type: cluster_inputs}
      - {name: destination, type: buffer}
      - {name: destination_offset, type: u64, doc: Bytes into destination.}
      - {name: scratch, type: buffer}
      - {name: scratch_offset, type: u64, doc: Bytes into scratch.}
      - {name: addresses, type: buffer}
      - {name: address_offset, type: u64, doc: Bytes into addresses.}
      - {name: address_stride, type: u64}
      - {name: sizes, type: buffer}
      - {name: size_offset, type: u64, doc: Bytes into sizes.}
      - {name: size_stride, type: u64}
      - {name: records, type: buffer}
      - {name: record_offset, type: u64, doc: Bytes into records.}
      - {name: record_stride, type: u64}
      - {name: count, type: buffer}
      - {name: count_offset, type: u64, doc: Bytes into count.}
      - {name: indirection, type: cluster_indirection}

  cluster_move_record:
    doc: A move record. The layout the backend reads.
    members:
      - {name: source, type: u64, doc: The address of the structure moved.}

  cluster_bottom_record:
    doc: >-
      A build_bottoms record: a cluster bottom structure of cluster_count
      clusters, each named once, whose addresses are cluster_stride bytes
      apart, at least 8, from clusters. The layout the backend reads.
    members:
      - {name: cluster_count, type: u32}
      - {name: cluster_stride, type: u32}
      - {name: clusters, type: u64}

  cluster_triangle_record:
    doc: >-
      A build_clusters record: a cluster of id cluster_id, not 0xFFFFFFFF,
      with cluster_flags (bfr_cluster_flag bits) and counts (a counts word,
      laid out by the cluster shift constants), at most
      bfr_caps_ray_tracing.max_cluster_triangles triangles and
      max_cluster_vertices vertices, its truncation at least the inputs'
      min_truncate_bits. base_geometry is a geometry word for every triangle;
      geometries, where not 0, holds a geometry word for each triangle,
      geometry_stride apart, which the backend combines with it. indices and vertices are addresses, index_stride and
      vertex_stride bytes apart (0 packed); micromaps, where not 0, is an
      opacity micromap's address, of operations with allow_opacity_micromaps,
      and micromap_indices, where not 0, its indices, micromap_index_stride
      apart. The layout the backend reads.
    members:
      - {name: cluster_id, type: u32}
      - {name: cluster_flags, type: u32}
      - {name: counts, type: u32}
      - {name: base_geometry, type: u32}
      - {name: index_stride, type: u16}
      - {name: vertex_stride, type: u16}
      - {name: geometry_stride, type: u16}
      - {name: micromap_index_stride, type: u16}
      - {name: indices, type: u64}
      - {name: vertices, type: u64}
      - {name: geometries, type: u64}
      - {name: micromaps, type: u64}
      - {name: micromap_indices, type: u64}

  cluster_template_record:
    doc: >-
      A build_templates record: as a bfr_cluster_triangle_record, but
      vertices may be 0, and bounds_limit, where not 0, is the address, a
      multiple of bfr_caps_ray_tracing.cluster_template_bounds_alignment, of
      a box of box_floats every instantiation lies within. The layout the
      backend reads.
    members:
      - {name: cluster, type: cluster_triangle_record}
      - {name: bounds_limit, type: u64}

  cluster_instantiate_record:
    doc: >-
      An instantiate_templates record: the template at cluster_template, its
      cluster id offset by cluster_id_offset and its geometry indices by
      geometry_index_offset (the low 24 bits, signed; the rest 0), with
      vertices read from vertices, vertex_stride bytes apart, or, where
      vertices is 0, the template's own. The layout the backend reads.
    members:
      - {name: cluster_id_offset, type: u32}
      - {name: geometry_index_offset, type: u32}
      - {name: cluster_template, type: u64}
      - {name: vertices, type: u64}
      - {name: vertex_stride, type: u64}

  cluster_template_indices_record:
    doc: A template_indices record. The layout the backend reads.
    members:
      - {name: cluster_template, type: u64, doc: The address of the template whose indices are written.}

  acceleration_structure_inputs:
    doc: >-
      What an acceleration structure is built from. A bottom one holds
      triangles or boxes, not both; a geometry's index in its array is the
      geometry index a hit group is chosen by. A top one holds instance_count
      instance records from instance_offset, a multiple of 16, in instances,
      which has acceleration_structure_input usage, laid out as
      bfr_write_instances writes them. A bottom one's triangles name their
      micromaps' usages in micromap_usages. An opacity micromap holds
      micromap_usages' micromaps: bfr_opacity_micromap_records,
      micromap_record_stride bytes apart from micromap_record_offset in
      micromap_records, whose states micromap_data
      holds from micromap_data_offset; both buffers have
      acceleration_structure_input usage, both offsets multiples of 256. A
      partitioned top one is built from partitioned.
      bfr_get_acceleration_structure_sizes reads the counts, formats, flags,
      usages and whether a transform is given.
    members:
      - {name: type, type: acceleration_structure_type, doc: 0 is bottom.}
      - {name: flags, type: acceleration_structure_flags}
      - {name: triangles, type: triangle_geometry, array: triangle_count, pointer: in, optional: true, doc: Read during the call only.}
      - {name: triangle_count, type: u32}
      - {name: boxes, type: box_geometry, array: box_count, pointer: in, optional: true, doc: Read during the call only.}
      - {name: box_count, type: u32}
      - {name: instances, type: buffer}
      - {name: instance_offset, type: u64, doc: Bytes into instances.}
      - {name: instance_count, type: u32}
      - {name: micromap_usages, type: opacity_micromap_usage, array: micromap_usage_count, pointer: in, optional: true, doc: Read during the call only.}
      - {name: micromap_usage_count, type: u32}
      - {name: micromap_data, type: buffer}
      - {name: micromap_data_offset, type: u64, doc: Bytes into micromap_data.}
      - {name: micromap_records, type: buffer}
      - {name: micromap_record_offset, type: u64, doc: Bytes into micromap_records.}
      - {name: micromap_record_stride, type: u32}
      - name: motion_keyframes
        type: u32
        doc: >-
          The structure's bfr_acceleration_structure_desc.motion_keyframes: its
          triangles' motion vertices are read, or its instance records are
          bfr_write_motion_instances'.
      - {name: partitioned, type: partitioned_top_inputs}

  acceleration_structure_sizes:
    doc: >-
      The bytes an acceleration structure takes, and the scratch bytes its
      build and its update take. discardable: the backend says an opacity
      micromap may be destroyed once the structures built with it are built.
    members:
      - {name: size, type: u64}
      - {name: build_scratch, type: u64}
      - {name: update_scratch, type: u64}
      - {name: discardable, type: bool}

  acceleration_structure_capture:
    doc: >-
      What a backend needs to make an acceleration structure again at the
      reference it had, as bfr_capture_acceleration_structure gives it:
      opaque, the same on every backend. All zero is none.
    members:
      - {name: words, type: u64, fixed: acceleration_structure_capture_words}

  acceleration_structure_desc:
    doc: >-
      How to create an acceleration structure of size bytes, in memory the
      device allocates. With motion_keyframes, at most
      bfr_caps_ray_tracing.max_motion_keyframes, where
      bfr_caps_features.ray_tracing_motion, its builds have motion: a bottom
      one's triangles move between keyframes, a top one holds motion
      instances, at most motion_instances of them, passed to backends that
      take it. 0 is none. With capture_replay, where
      bfr_caps_features.acceleration_structure_capture_replay, its reference
      may be captured, by bfr_capture_acceleration_structure, and replayed:
      with replay, what that gave for a structure made with this desc but
      replay, on a device of the same adapter opened with the same queues, it
      is made at the reference that one had, or fails where the backend
      cannot give it. An opacity micromap has none where the backend gives it
      no reference (Vulkan).
    extensible: true
    members:
      - {name: type, type: acceleration_structure_type, doc: 0 is bottom.}
      - {name: size, type: u64, doc: "Bytes, as bfr_get_acceleration_structure_sizes gives them."}
      - {name: motion_keyframes, type: u32}
      - {name: motion_instances, type: u32}
      - {name: capture_replay, type: bool}
      - {name: replay, type: acceleration_structure_capture, doc: All zero is none.}

  acceleration_structure_build_range:
    doc: >-
      One geometry's counts, as a buffer holds them for
      bfr_build_acceleration_structure_indirect: primitive_count triangles,
      boxes or instances, from primitive_offset bytes into the geometry's
      indices, or its vertices, boxes or instances where it has none. A
      triangle's vertices are first_vertex on from its indices, or from
      primitive_offset; its transform is transform_offset bytes in. The layout
      every backend reads.
    members:
      - {name: primitive_count, type: u32}
      - {name: primitive_offset, type: u32}
      - {name: first_vertex, type: u32}
      - {name: transform_offset, type: u32}

  acceleration_structure_build:
    doc: >-
      A build of dst, of inputs' type, from inputs; or, with update, an update
      of src into dst (they may be the same), src built with allow_update and
      inputs as its last build gave them but for the data the buffers hold. A
      partitioned top one's update starts from src, a partitioned top one
      built before, with no allow_update; its build starts from none. Scratch
      is scratch_offset bytes into scratch, which has
      acceleration_structure_scratch usage, a multiple of
      bfr_caps_ray_tracing.scratch_alignment, and of 256 for a partitioned
      top one, at least the build's or update's scratch bytes, the build's for
      both of a partitioned top one, and overlaps neither structure.
    members:
      - {name: dst, type: acceleration_structure}
      - {name: src, type: acceleration_structure}
      - {name: update, type: bool}
      - {name: inputs, type: acceleration_structure_inputs}
      - {name: scratch, type: buffer}
      - {name: scratch_offset, type: u64, doc: Bytes into scratch.}

  acceleration_structure_instance:
    doc: One instance of a bottom acceleration structure in a top one.
    members:
      - {name: transform, type: f32, fixed: transform_floats, doc: 3x4 row-major object-to-world transform.}
      - {name: custom_index, type: u32, doc: What the shader reads as the instance's custom index; below instance_index_limit.}
      - {name: mask, type: u8, doc: Rays whose mask ANDs to 0 with it miss the instance.}
      - {name: hit_group_offset, type: u32, doc: "The instance's offset, in records, into the hit region; below instance_index_limit."}
      - {name: cull_disable, type: bool}
      - {name: front_counter_clockwise, type: bool}
      - {name: opacity, type: instance_opacity, doc: 0 is as each geometry says.}
      - {name: force_opacity_micromap_2_state, type: bool, doc: "Its opacity micromaps' unknown states are taken as known, where bfr_caps_features.opacity_micromap."}
      - {name: disable_opacity_micromaps, type: bool, doc: "Its opacity micromaps are ignored, of a bottom structure built with allow_disable_opacity_micromaps."}
      - {name: bottom_structure, type: acceleration_structure, doc: "Null, with no bottom_reference, is an instance no ray hits."}
      - name: bottom_reference
        type: u64
        doc: >-
          Where bottom_structure is null, what the instance names its bottom
          structure by, for one BFR holds no handle to, such as a cluster
          bottom structure (bfr_build_clusters).

  srt_transform:
    doc: >-
      A transform as its parts: scale, the shears a (xy), b (xz) and c (yz),
      and a pivot added after them, then a rotation quaternion (x, y, z, w)
      about the origin and a translation. Keyframes between are blended part
      by part.
    members:
      - {name: scale, type: f32, fixed: 3}
      - {name: shear, type: f32, fixed: 3}
      - {name: pivot, type: f32, fixed: 3}
      - {name: rotation, type: f32, fixed: 4}
      - {name: translation, type: f32, fixed: 3}

  motion_keyframe:
    doc: "One keyframe of a motion instance's transform: matrix for matrix motion, srt for srt motion."
    members:
      - {name: matrix, type: f32, fixed: transform_floats, doc: 3x4 row-major transform.}
      - {name: srt, type: srt_transform}

  acceleration_structure_motion_instance:
    doc: >-
      An instance in a top structure with motion: instance, whose transform is
      the instance's where motion is none, and keyframe_count keyframes from
      first_keyframe in the keyframes bfr_write_motion_instances is given, the
      first at time 0 and the last at 1, where it moves.
    members:
      - {name: instance, type: acceleration_structure_instance}
      - {name: motion, type: instance_motion, doc: 0 is none.}
      - {name: first_keyframe, type: u32}
      - {name: keyframe_count, type: u32}

  acceleration_structure_property_pool_desc:
    doc: >-
      How to create a property pool of count entries of property, at least 1,
      of opacity micromaps where opacity_micromaps, and of other structures
      where not.
    extensible: true
    members:
      - {name: property, type: acceleration_structure_property, doc: 0 is compacted_size.}
      - {name: count, type: u32}
      - {name: opacity_micromaps, type: bool}

  swapchain_query:
    doc: Which window to ask about.
    extensible: true
    members:
      - {name: window, type: window}

  caps_info:
    doc: What an adapter is.
    members:
      - {name: name, type: string, lifetime: instance}
      - {name: type, type: adapter_type}
      - {name: backend, type: backend}
      - {name: vendor_id, type: u32, doc: "The PCI vendor ID: 0x10DE NVIDIA, 0x1002 AMD, 0x8086 Intel, 0x13B5 Arm, 0x5143 Qualcomm."}
      - {name: device_id, type: u32, doc: The vendor's ID for the GPU.}
      - {name: driver_name, type: string, lifetime: instance, doc: Empty when the driver does not say.}
      - {name: driver_info, type: string, lifetime: instance, doc: "The driver's version as text; empty when the driver does not say."}
      - {name: driver_version, type: u64, doc: "The driver's version, in the vendor's own encoding."}
      - {name: api_major, type: u32, doc: "The newest API version the adapter supports: Vulkan 1.3.280 is 1, 3, 280. D3D12: the highest feature level, 12_1 being 12, 1. Metal: the GPU family version, Metal 4 being 4."}
      - {name: api_minor, type: u32}
      - {name: api_patch, type: u32}
      - {name: device_uuid, type: u8, fixed: 16, doc: The same GPU has the same UUID in every process and API.}
      - {name: driver_uuid, type: u8, fixed: 16}
      - {name: luid, type: u8, fixed: 8, doc: "Windows' ID for the GPU, as D3D12 and DXGI give it."}
      - {name: luid_valid, type: bool, doc: Whether luid is set; only on Windows.}
      - {name: cache_uuid, type: u8, fixed: 16, doc: "The backend's ID for the adapter and driver whose pipeline cache data loads; all 0 where the backend states none."}

  caps_limits:
    doc: The adapter's limits on textures, buffers, rendering and sampling.
    members:
      - {name: max_texture_1d, type: u32, doc: Widest 1D texture.}
      - {name: max_texture_2d, type: u32, doc: Widest or tallest 2D texture.}
      - {name: max_texture_3d, type: u32, doc: Largest side of a 3D texture.}
      - {name: max_texture_cube, type: u32, doc: Largest side of a cube texture.}
      - {name: max_texture_layers, type: u32, doc: Most layers in an array texture.}
      - {name: max_buffer_size, type: u64, doc: Largest buffer in bytes.}
      - {name: max_allocation_size, type: u64, doc: Largest single allocation in bytes.}
      - {name: max_allocations, type: u32, doc: Most allocations alive at once.}
      - {name: max_sampler_objects, type: u32, doc: Most samplers alive at once.}
      - {name: max_uniform_buffer_range, type: u32, doc: Most bytes a shader reads through one uniform buffer view.}
      - {name: max_storage_buffer_range, type: u32, doc: Most bytes a shader reaches through one storage buffer view.}
      - {name: max_texel_buffer_elements, type: u32, doc: Most elements in a texel buffer view.}
      - {name: max_push_constants_size, type: u32, doc: "Bytes of push constants every pipeline's shaders read, and the most bfr_push_constants takes: the device's limit on Vulkan, the root signature's room on D3D12, 128 on Metal."}
      - {name: max_color_attachments, type: u32}
      - {name: max_render_width, type: u32, doc: Widest render area.}
      - {name: max_render_height, type: u32, doc: Tallest render area.}
      - {name: max_render_layers, type: u32, doc: Most layers rendered at once.}
      - {name: color_sample_counts, type: u32, doc: "Sample counts for float and normalized color attachments: each set bit is a count it supports, 1, 2, 4 and so on. 0 on D3D12, which answers per format only, in bfr_format_caps.sample_counts."}
      - {name: integer_sample_counts, type: u32, doc: "Sample counts for integer color attachments; 0 on D3D12, as color_sample_counts says."}
      - {name: depth_sample_counts, type: u32, doc: "Sample counts for depth attachments; 0 on D3D12, as color_sample_counts says."}
      - {name: stencil_sample_counts, type: u32, doc: "Sample counts for stencil attachments; 0 on D3D12, as color_sample_counts says."}
      - {name: no_attachment_sample_counts, type: u32, doc: Sample counts for rendering with no attachments.}
      - {name: storage_texture_sample_counts, type: u32, doc: Sample counts for storage textures.}
      - {name: max_viewports, type: u32}
      - {name: max_viewport_width, type: u32}
      - {name: max_viewport_height, type: u32}
      - {name: max_draw_indirect_count, type: u32, doc: Most draws one indirect call makes.}
      - {name: max_clip_distances, type: u32}
      - {name: max_cull_distances, type: u32}
      - {name: max_sampler_anisotropy, type: f32}
      - {name: max_sampler_lod_bias, type: f32}
      - {name: max_custom_border_color_samplers, type: u32, doc: Samplers with a custom border colour alive at once.}
      - {name: min_shading_rate_tile, type: u32, fixed: 2, doc: "Smallest tile of a shading rate texture, width and height; 0 without one."}
      - {name: max_shading_rate_tile, type: u32, fixed: 2, doc: "Largest tile of a shading rate texture, width and height; 0 without one."}
      - {name: min_uniform_buffer_alignment, type: u64, doc: Alignment in bytes of a uniform buffer view's offset.}
      - {name: min_storage_buffer_alignment, type: u64, doc: Alignment in bytes of a storage buffer view's offset.}
      - {name: min_texel_buffer_alignment, type: u64, doc: Alignment in bytes of a texel buffer view's offset.}
      - {name: copy_offset_alignment, type: u64, doc: Best alignment in bytes of a buffer offset in a texture copy.}
      - {name: copy_row_pitch_alignment, type: u64, doc: Best alignment in bytes of a row in a texture copy.}
      - {name: non_coherent_atom_size, type: u64, doc: Granularity in bytes of flushing memory the CPU writes without coherence.}
      - {name: buffer_texture_granularity, type: u64, doc: Bytes apart a buffer and a texture in one allocation must be.}

  caps_bindless:
    doc: How many of each resource the bindless tables can hold.
    members:
      - {name: max_textures, type: u32, doc: Sampled textures.}
      - {name: max_storage_textures, type: u32}
      - {name: max_storage_buffers, type: u32}
      - {name: max_uniform_buffers, type: u32}
      - {name: max_samplers, type: u32}
      - {name: max_per_stage, type: u32, doc: All of them together that one shader stage can reach.}
      - {name: max_acceleration_structures, type: u32, doc: Top acceleration structures; 0 where the device has no such table.}

  caps_compute:
    doc: The adapter's compute limits.
    members:
      - {name: max_workgroup_count, type: u32, fixed: 3, doc: "Most workgroups one dispatch makes in x, y and z."}
      - {name: max_workgroup_size, type: u32, fixed: 3, doc: "Largest workgroup in x, y and z."}
      - {name: max_workgroup_invocations, type: u32, doc: Most invocations in one workgroup.}
      - {name: max_shared_memory, type: u32, doc: Most bytes of workgroup shared memory.}
      - {name: subgroup_size, type: u32, doc: "Invocations in a subgroup (a wave or warp) by default. D3D12 has no default; it reports its minimum."}
      - {name: min_subgroup_size, type: u32}
      - {name: max_subgroup_size, type: u32}

  caps_mesh:
    doc: The adapter's mesh and task shader limits; all 0 without mesh shaders.
    members:
      - {name: max_mesh_workgroup_size, type: u32, fixed: 3}
      - {name: max_mesh_invocations, type: u32}
      - {name: max_mesh_output_vertices, type: u32}
      - {name: max_mesh_output_primitives, type: u32}
      - {name: max_mesh_shared_memory, type: u32}
      - {name: max_task_workgroup_size, type: u32, fixed: 3}
      - {name: max_task_invocations, type: u32}
      - {name: max_task_payload_size, type: u32}
      - name: max_task_workgroup_count
        type: u32
        fixed: 3
        doc: >-
          What a bfr_draw_mesh's counts stay within: of the task shader's
          workgroups where the pipeline has one, else of the mesh shader's.
      - {name: max_task_workgroup_total_count, type: u32}
      - {name: max_task_shared_memory, type: u32}
      - {name: max_task_payload_and_shared_memory, type: u32}
      - {name: max_mesh_workgroup_count, type: u32, fixed: 3}
      - {name: max_mesh_workgroup_total_count, type: u32}
      - name: max_mesh_output_memory
        type: u32
        doc: >-
          The bytes a mesh shader outputs, its vertices' and primitives' sizes
          each rounded up to their granularity.
      - {name: mesh_output_per_vertex_granularity, type: u32}
      - {name: mesh_output_per_primitive_granularity, type: u32}
      - {name: max_mesh_payload_and_shared_memory, type: u32}
      - {name: max_mesh_payload_and_output_memory, type: u32}
      - {name: max_mesh_output_components, type: u32}
      - {name: max_mesh_output_layers, type: u32}
      - {name: max_mesh_multiview_views, type: u32}

  caps_ray_tracing:
    doc: >-
      The adapter's ray tracing limits. The structure limits are 0 without
      acceleration structures, the rest without ray tracing pipelines.
    members:
      - {name: max_geometries, type: u64, doc: Most geometries in a bottom-level structure.}
      - {name: max_instances, type: u64, doc: Most instances in a top-level structure.}
      - {name: max_primitives, type: u64, doc: Most primitives in a bottom-level structure.}
      - {name: scratch_alignment, type: u32, doc: Alignment in bytes of a build's scratch memory.}
      - {name: max_recursion_depth, type: u32, doc: Deepest ray recursion; 0 without ray tracing pipelines.}
      - {name: identifier_size, type: u32, doc: "The bytes of a shader group's identifier, which a binding table record starts with."}
      - {name: identifier_alignment, type: u32, doc: The alignment in bytes of a binding table record's start.}
      - {name: table_alignment, type: u32, doc: The alignment in bytes of a binding table region's start.}
      - {name: max_shader_group_stride, type: u32}
      - {name: max_trace_rays, type: u32, doc: The most rays one trace makes.}
      - {name: max_hit_attribute_size, type: u32}
      - {name: property_entry_bytes, type: u32, doc: The bytes of one entry bfr_resolve_acceleration_structure_properties writes.}
      - {name: reorders_invocations, type: bool, doc: "Shaders that reorder invocations may see them reordered: the backend says it reorders."}
      - {name: max_binding_table_record_index, type: u32, doc: The highest binding table record index a reordered hit names.}
      - {name: instance_size, type: u32, doc: The bytes of one record bfr_write_instances writes.}
      - {name: capture_replay_identifier_size, type: u32, doc: The bytes of one group's identifier bfr_get_capture_replay_identifiers writes.}
      - {name: max_opacity_2_state_subdivision_level, type: u32, doc: The highest subdivision level of a two-state opacity micromap.}
      - {name: max_opacity_4_state_subdivision_level, type: u32, doc: The highest subdivision level of a four-state opacity micromap.}
      - {name: max_motion_keyframes, type: u32, doc: "The most keyframes a structure with motion, or a motion instance, has."}
      - {name: motion_instance_size, type: u32, doc: The bytes from one record bfr_write_motion_instances writes to the next.}
      - {name: max_partitions, type: u32, doc: "The most partitions, the global partition's instances counted as partitions, a partitioned top structure holds."}
      - {name: max_cluster_vertices, type: u32, doc: The most vertices one cluster holds.}
      - {name: max_cluster_triangles, type: u32, doc: The most triangles one cluster holds.}
      - {name: cluster_scratch_alignment, type: u32, doc: The alignment in bytes of a cluster operation's scratch.}
      - {name: cluster_alignment, type: u32, doc: The alignment in bytes of a cluster.}
      - {name: cluster_template_alignment, type: u32, doc: The alignment in bytes of a cluster template.}
      - {name: cluster_bottom_alignment, type: u32, doc: The alignment in bytes of a cluster bottom structure.}
      - {name: cluster_template_bounds_alignment, type: u32, doc: "The alignment in bytes of a template record's bounds_limit."}
      - {name: max_cluster_geometry_index, type: u32, doc: The geometry indices of clusters are below it.}

  caps_features:
    doc: Optional features the adapter has. What BFR needs, which bfr_backend states, is always there and not listed.
    members:
      - {name: ray_query, type: bool, doc: Rays traced inline from compute shaders.}
      - {name: ray_query_graphics, type: bool, doc: "Rays traced inline from vertex, fragment, task and mesh shaders."}
      - {name: ray_tracing_pipeline, type: bool, doc: Ray tracing pipelines and shader binding tables.}
      - {name: trace_rays_indirect, type: bool, doc: bfr_trace_rays_indirect.}
      - {name: ray_primitive_culling, type: bool, doc: Rays that skip triangles or boxes.}
      - {name: acceleration_structure, type: bool}
      - {name: buffer_address, type: bool, doc: bfr_get_buffer_address.}
      - {name: ray_position_fetch, type: bool, doc: "Shaders read a hit triangle's positions, of a structure built with allow_data_access."}
      - {name: acceleration_structure_serialization, type: bool, doc: bfr_serialize_acceleration_structure and its kin.}
      - {name: acceleration_structure_current_size, type: bool, doc: The current_size property.}
      - {name: serialized_bottom_count, type: bool, doc: The serialized_bottom_count property.}
      - {name: ray_invocation_reorder, type: bool, doc: Shaders reorder ray tracing invocations.}
      - {name: ray_tracing_pipeline_library, type: bool, doc: "Ray tracing pipeline libraries, bfr_ray_tracing_pipeline_desc.library."}
      - {name: pipeline_library_identifiers, type: bool, doc: "bfr_get_shader_identifiers of a library, the same as a pipeline that links it gives for its groups."}
      - {name: ray_tracing_capture_replay, type: bool, doc: bfr_ray_tracing_pipeline_desc.capture_replay.}
      - {name: ray_tracing_capture_replay_mixed, type: bool, doc: "A device makes pipelines with replayed identifiers and pipelines without them in any order, at once."}
      - {name: acceleration_structure_indirect_build, type: bool, doc: bfr_build_acceleration_structure_indirect.}
      - {name: opacity_micromap, type: bool, doc: "Opacity micromap structures, which bottom structures' triangles take their opacity from."}
      - {name: ray_tracing_motion, type: bool, doc: "Structures with motion, traced at a time by pipelines made with allow_motion."}
      - {name: ray_tracing_motion_indirect, type: bool, doc: bfr_trace_rays_indirect with a pipeline made with allow_motion.}
      - {name: partitioned_top, type: bool, doc: "Partitioned top structures, and their table (bfr_device_desc.max_bindless_partitioned_tops)."}
      - {name: cluster_acceleration_structure, type: bool, doc: "bfr_build_clusters, and traces of the cluster bottom structures it builds by pipelines made with allow_clusters."}
      - {name: acceleration_structure_capture_replay, type: bool, doc: bfr_acceleration_structure_desc.capture_replay.}
      - {name: mesh_shader, type: bool}
      - {name: task_shader, type: bool}
      - {name: shading_rate, type: bool, doc: A shading rate per draw.}
      - {name: shading_rate_texture, type: bool, doc: "A shading rate per screen tile, from a texture."}
      - {name: shader_float16, type: bool}
      - {name: shader_float64, type: bool}
      - {name: shader_int8, type: bool}
      - {name: shader_int16, type: bool}
      - {name: shader_int64, type: bool}
      - {name: atomic_int64, type: bool, doc: 64-bit integer atomics on buffers.}
      - {name: atomic_int64_texture, type: bool, doc: 64-bit integer atomics on storage textures.}
      - {name: atomic_float32_add, type: bool, doc: 32-bit float atomic add on buffers.}
      - {name: barycentrics, type: bool, doc: Fragment shaders read barycentric coordinates.}
      - {name: conservative_raster, type: bool}
      - {name: geometry_shader, type: bool}
      - {name: tessellation, type: bool}
      - {name: multiview, type: bool}
      - {name: sample_rate_shading, type: bool}
      - {name: dual_source_blend, type: bool}
      - {name: independent_blend, type: bool, doc: Each color attachment blends its own way.}
      - {name: logic_op, type: bool}
      - {name: depth_clamp, type: bool}
      - {name: depth_bounds, type: bool}
      - {name: wireframe, type: bool}
      - {name: wide_lines, type: bool}
      - {name: sampler_anisotropy, type: bool}
      - {name: sampler_minmax, type: bool, doc: Samplers that return the minimum or maximum of the texels they read.}
      - {name: sampler_mirror_clamp_to_edge, type: bool}
      - {name: sampler_anisotropy_nearest_mip, type: bool, doc: Anisotropy with mip_filter nearest.}
      - {name: sampler_anisotropy_nearest_filter, type: bool, doc: Anisotropy with min or mag filter nearest.}
      - {name: sampler_custom_border_color, type: bool, doc: "A border colour other than (0,0,0,0), (0,0,0,1) and (1,1,1,1)."}
      - {name: sampler_integer_border_color, type: bool, doc: A border colour for textures that hold integers.}
      - {name: sampler_unnormalized_coordinates, type: bool}
      - name: volume_color_targets
        type: bool
        doc: A 3D texture with color_attachment usage is drawn to by depth slice, which a bfr_color_attachment's layer and layer_count name. Not for a sparse one on Vulkan.
      - {name: sampler_lod_bias, type: bool, doc: A lod_bias other than 0.}
      - {name: sampler_lod_average, type: bool}
      - {name: compression_bc, type: bool}
      - {name: compression_etc2, type: bool}
      - {name: compression_astc, type: bool}
      - {name: compression_astc_hdr, type: bool}
      - {name: multi_draw_indirect, type: bool}
      - {name: draw_indirect_count, type: bool, doc: Indirect draws that read their count from a buffer.}
      - {name: draw_indirect_first_instance, type: bool}
      - {name: triangle_fans, type: bool, doc: topology_triangle_fan draws.}
      - {name: list_restart, type: bool, doc: "primitive_restart on list topologies, not only strips."}
      - {name: dynamic_topology, type: bool, doc: "bfr_set_topology, which fails with error_unsupported where this is false."}
      - {name: mesh_multiview, type: bool, doc: "Mesh pipelines in multiview renderings, where multiview."}
      - {name: mesh_statistics, type: bool, doc: Pipeline statistics and primitive queries count task and mesh work.}
      - {name: alpha_to_one, type: bool, doc: bfr_graphics_pipeline_desc.alpha_to_one.}
      - {name: sample_mask, type: bool, doc: A bfr_graphics_pipeline_desc.sample_mask that leaves samples out.}
      - {name: pipeline_cache, type: bool, doc: bfr_create_pipeline_cache makes caches.}
      - {name: storage_read_without_format, type: bool}
      - {name: storage_write_without_format, type: bool}
      - name: storage_texture_non_uniform_indexing
        type: bool
        doc: A storage texture table indexed by a value that differs within a shader's invocation group.
      - name: uniform_buffer_non_uniform_indexing
        type: bool
        doc: The uniform buffer table indexed by a value that differs within a shader's invocation group.
      - {name: timestamps_on_all_queues, type: bool, doc: Every graphics and compute queue writes timestamps.}
      - {name: queries, type: bool, doc: "bfr_create_query_pool makes occlusion pools, and pipeline_statistics and mesh_primitives_generated ones where pipeline_statistics and mesh_statistics say."}
      - {name: pipeline_statistics, type: bool}
      - {name: occlusion_query_precise, type: bool}
      - {name: debug_labels, type: bool, doc: "bfr_begin_debug_label, bfr_end_debug_label and bfr_insert_debug_label."}
      - {name: queue_debug_labels, type: bool, doc: "bfr_begin_queue_debug_label, bfr_end_queue_debug_label and bfr_insert_queue_debug_label."}

  memory_heap:
    doc: One pool of memory.
    members:
      - {name: size, type: u64, doc: Bytes.}
      - {name: device_local, type: bool, doc: On or nearest the GPU.}
      - {name: host_visible, type: bool, doc: Some memory type in it is visible to the CPU.}

  memory_type:
    doc: One kind of memory in a heap.
    members:
      - {name: heap, type: u32, doc: Index into the heaps.}
      - {name: device_local, type: bool}
      - {name: host_visible, type: bool, doc: The CPU can map it.}
      - {name: host_coherent, type: bool, doc: CPU writes reach the GPU without a flush.}
      - {name: host_cached, type: bool, doc: CPU reads are cached.}
      - {name: lazily_allocated, type: bool, doc: Backed only as the GPU needs it; for transient attachments on tiled GPUs.}

  caps_memory:
    doc: The adapter's memory.
    members:
      - {name: heap_count, type: u32}
      - {name: heaps, type: memory_heap, fixed: 16, doc: The first heap_count are set.}
      - {name: type_count, type: u32}
      - {name: types, type: memory_type, fixed: 32, doc: The first type_count are set.}
      - {name: unified, type: bool, doc: The GPU and CPU share one memory.}

  queue_levels:
    doc: The bfr_queue_level values a kind of queue takes; each true where the backend says so.
    members:
      - {name: normal, type: bool}
      - {name: low, type: bool}
      - {name: high, type: bool}
      - {name: realtime, type: bool}

  copy_granularity:
    doc: >-
      How a copy between a buffer and a texture, or between two textures,
      lines up in a kind of queue's lists, in texels, or texel blocks for a
      compressed format: its offsets are multiples of width, height and depth,
      and each size is a multiple too or reaches the edge of the mip level.
      With whole_levels it copies whole mip levels only, from 0. All 0 and
      false where the backend states none.
    members:
      - {name: width, type: u32}
      - {name: height, type: u32}
      - {name: depth, type: u32}
      - {name: whole_levels, type: bool}

  caps_queues:
    doc: >-
      How many queues of each type the adapter has, and what they do, for a
      device opened without a window. On Vulkan a window may move a type to
      another family that presents to it, with its own counts, timestamp bits
      and levels. The counts are 0 where the backend has no count of queues;
      bfr_create_device then takes any number of each.
    members:
      - {name: graphics, type: u32, doc: Queues that run graphics.}
      - {name: compute, type: u32, doc: Queues that run compute but not graphics (async compute).}
      - {name: copy, type: u32, doc: Queues that only copy.}
      - {name: graphics_timestamp_bits, type: u32, doc: Valid bits in a graphics queue's timestamps; 0 without timestamps.}
      - {name: compute_timestamp_bits, type: u32}
      - {name: copy_timestamp_bits, type: u32}
      - name: ranks
        type: u32
        doc: >-
          The distinct priorities the backend gives a device's queues by their bfr_queue_desc.rank;
          0 where it doesn't rank them.
      - {name: graphics_levels, type: queue_levels, doc: Levels a graphics queue takes; none set where the backend has no setting.}
      - {name: compute_levels, type: queue_levels}
      - {name: copy_levels, type: queue_levels}
      - {name: graphics_sparse, type: bool, doc: Graphics queues run bfr_update_tile_mappings.}
      - {name: compute_sparse, type: bool}
      - {name: copy_sparse, type: bool}
      - {name: graphics_granularity, type: copy_granularity, doc: How a graphics queue's copies line up.}
      - {name: compute_granularity, type: copy_granularity}
      - {name: copy_granularity, type: copy_granularity}

  timestamp_stages:
    doc: The bfr_timestamp_stage values a timestamp write takes; each true where the backend says so.
    members:
      - {name: end, type: bool}
      - {name: start, type: bool}
      - {name: vertex, type: bool}
      - {name: fragment, type: bool}
      - {name: compute, type: bool}
      - {name: copy, type: bool}
      - {name: task, type: bool}
      - {name: mesh, type: bool}
      - {name: ray_tracing, type: bool}
      - {name: acceleration_structure_build, type: bool}

  host_clocks:
    doc: The bfr_host_clock values bfr_calibrate_timestamps reads beside a GPU timestamp.
    members:
      - {name: monotonic, type: bool}
      - {name: monotonic_raw, type: bool}
      - {name: performance_counter, type: bool}

  caps_timestamps:
    doc: What the adapter's GPU timestamps are.
    members:
      - {name: graphics, type: bool, doc: Graphics queues write timestamps.}
      - {name: compute, type: bool, doc: Compute queues write timestamps.}
      - {name: copy, type: bool, doc: Copy queues write timestamps.}
      - {name: outside_rendering, type: timestamp_stages, doc: The stages a write on a graphics queue outside rendering takes.}
      - {name: inside_rendering, type: timestamp_stages, doc: The stages a write between bfr_begin_rendering and bfr_end_rendering takes.}
      - {name: compute_stages, type: timestamp_stages, doc: The stages a write on a compute queue takes.}
      - {name: copy_stages, type: timestamp_stages, doc: The stages a write on a copy queue takes.}
      - name: graphics_resets
        type: bool
        doc: >-
          Graphics queues record bfr_reset_timestamps. A pool written on a kind
          of queue that can't is reset on one that can, ordered before the
          writes by a submit's wait.
      - {name: compute_resets, type: bool, doc: Compute queues record bfr_reset_timestamps.}
      - {name: copy_resets, type: bool, doc: Copy queues record bfr_reset_timestamps.}
      - {name: granularity, type: bool, doc: The backend takes a bfr_timestamp_granularity; where false the value is unused.}
      - {name: entry_bytes, type: u32, doc: What one timestamp takes in a buffer bfr_resolve_timestamps writes.}
      - {name: host_clocks, type: host_clocks, doc: The clocks bfr_calibrate_timestamps reads.}

  caps_sparse:
    doc: >-
      What the adapter's sparse resources are; each true where the backend
      says so, or its documentation where it has no query, as each backend
      names.
    members:
      - {name: binding, type: bool, doc: Resources made with sparse take tiles at all.}
      - {name: buffers, type: bool}
      - {name: textures_2d, type: bool}
      - {name: textures_3d, type: bool}
      - {name: samples_2, type: bool, doc: Sparse 2D textures with 2 samples.}
      - {name: samples_4, type: bool}
      - {name: samples_8, type: bool}
      - {name: samples_16, type: bool}
      - {name: aliased, type: bool, doc: Resources made with sparse_aliased share memory's tiles.}
      - {name: standard_2d_shape, type: bool, doc: 2D textures' tiles have the standard shapes.}
      - {name: standard_2d_multisample_shape, type: bool}
      - {name: standard_3d_shape, type: bool}
      - {name: aligned_mip_size, type: bool, doc: Every mip level not a whole number of tiles is in the tail.}
      - {name: non_resident_strict, type: bool, doc: Reads of an unmapped tile give 0 and writes to one are dropped.}
      - {name: shader_residency, type: bool, doc: Shaders ask whether what they read was mapped.}
      - {name: mixed_resources, type: bool, doc: One sparse memory holds textures' and buffers' tiles together.}
      - {name: layer_tails, type: bool, doc: Tail mappings take a layer other than 0.}
      - {name: address_space_bytes, type: u64, doc: "Bytes of sparse resources a device holds, where the backend counts them so."}
      - {name: address_bits_per_resource, type: u32, doc: "Bits of a resource's GPU addresses, where the backend counts them so."}
      - {name: address_bits_per_process, type: u32}
      - {name: tile_byte_count, type: u32}
      - {name: tile_bytes, type: u32, fixed: 3, doc: "The first tile_byte_count are the tile sizes, in bytes, a sparse resource is made with; none where the backend sets them itself, and bfr_texture_tiling and bfr_buffer_tiling say what they are. 3 is Metal's sparse page sizes."}

  caps_resolve:
    doc: >-
      How a rendering's depth-stencil attachment resolves.
    members:
      - {name: depth_modes, type: u32, doc: "Bit 1 << mode set for each resolve_mode but none the device takes for depth."}
      - {name: stencil_modes, type: u32, doc: "As depth_modes, for stencil."}
      - {name: independent, type: bool, doc: Depth and stencil may take different modes.}
      - {name: independent_none, type: bool, doc: Depth and stencil may differ where one is none.}

  caps:
    doc: Everything about an adapter that stays the same while it runs.
    members:
      - {name: info, type: caps_info}
      - {name: limits, type: caps_limits}
      - {name: bindless, type: caps_bindless}
      - {name: compute, type: caps_compute}
      - {name: mesh, type: caps_mesh}
      - {name: ray_tracing, type: caps_ray_tracing}
      - {name: features, type: caps_features}
      - {name: memory, type: caps_memory}
      - {name: queues, type: caps_queues}
      - {name: timestamps, type: caps_timestamps}
      - {name: sparse, type: caps_sparse}
      - {name: resolve, type: caps_resolve}

  format_caps:
    doc: What an adapter does with one format.
    members:
      - {name: format, type: format}
      - {name: sampled, type: bool, doc: Shaders sample textures of it.}
      - {name: filter_linear, type: bool, doc: Samplers filter it linearly.}
      - {name: filter_minmax, type: bool, doc: Min and max samplers read it.}
      - {name: storage, type: bool, doc: Shaders read and write storage textures of it.}
      - {name: storage_atomic, type: bool, doc: Shaders use atomics on storage textures of it.}
      - {name: color_attachment, type: bool}
      - {name: blend, type: bool, doc: Color attachments of it blend.}
      - {name: depth_stencil, type: bool}
      - {name: copy_src, type: bool}
      - {name: copy_dst, type: bool}
      - {name: texel_buffer, type: bool, doc: Shaders read texel buffers of it.}
      - {name: storage_texel_buffer, type: bool}
      - {name: storage_texel_buffer_atomic, type: bool}
      - {name: sample_counts, type: u32, doc: "Sample counts for 2D textures of it: each set bit is a count, 1, 2, 4 and so on; 0 when it can't be rendered to."}
      - {name: resolve, type: bool, doc: "Multisampled textures of it resolve into single-sample ones: color formats in a rendering and by bfr_resolve_texture, depth and stencil formats in a rendering, by the modes bfr_caps_resolve names."}
      - {name: acceleration_structure_vertices, type: bool, doc: bfr_triangle_geometry's vertex_format takes it.}

  swapchain_caps:
    doc: What a window's swapchain may be, on one adapter.
    members:
      - {name: min_image_count, type: u32}
      - {name: max_image_count, type: u32, doc: 0 for no limit.}
      - {name: width, type: u32, doc: The window's size now; 0xFFFFFFFF each when the swapchain's size sets the window's.}
      - {name: height, type: u32}
      - {name: min_width, type: u32}
      - {name: min_height, type: u32}
      - {name: max_width, type: u32}
      - {name: max_height, type: u32}
      - {name: rotation, type: display_rotation, doc: How the display is turned now; on phones the app may render turned to match.}
      - {name: fifo, type: bool, doc: "Presents wait for vertical blank and queue up. Always there."}
      - {name: fifo_relaxed, type: bool, doc: "As fifo, but a late frame presents at once, and may tear."}
      - {name: mailbox, type: bool, doc: "Presents wait for vertical blank, and a newer frame replaces a waiting one."}
      - {name: immediate, type: bool, doc: "Presents at once, and may tear."}
      - {name: alpha_opaque, type: bool, doc: The window ignores alpha.}
      - {name: alpha_premultiplied, type: bool}
      - {name: alpha_postmultiplied, type: bool}
      - {name: alpha_inherit, type: bool, doc: The window system decides how alpha blends.}

  swapchain_format:
    doc: A format and color space a window's swapchain may use.
    members:
      - {name: format, type: format}
      - {name: color_space, type: color_space}

  memory_budget_heap:
    doc: How much of one heap the process may use, and uses.
    members:
      - {name: budget, type: u64, doc: Bytes the process may use before allocations start failing or slowing.}
      - {name: usage, type: u64, doc: Bytes the process uses now.}

  memory_budget:
    doc: A device's memory use now, heap by heap, in the order bfr_caps lists the heaps.
    members:
      - {name: heap_count, type: u32}
      - {name: heaps, type: memory_budget_heap, fixed: 16, doc: The first heap_count are set.}

functions:
  get_last_error:
    doc: >-
      The message for the calling thread's last error. Valid until that
      thread's next BFR call.
    returns: string
    params: []

  get_backends:
    doc: >-
      Lists the backends this build has, in bfr_backend order. With backends
      null, writes how many there are to count. Otherwise writes up to count
      of them, sets count to how many it wrote, and returns incomplete if
      there were more.
    returns: result
    params:
      - {name: count, type: u32, pointer: inout}
      - {name: backends, type: backend, array: count, pointer: out, optional: true}

  create_instance:
    doc: Creates an instance and lists its adapters.
    returns: result
    params:
      - {name: desc, type: instance_desc, pointer: in}
      - {name: instance, type: instance, pointer: out}

  destroy_instance:
    doc: >-
      Destroys an instance. One with devices left lives on until the last of
      them is destroyed, so they may be destroyed in any order; its message
      callback may still be called until then. Null does nothing.
    params:
      - {name: instance, type: instance, optional: true}

  get_adapters:
    doc: >-
      Lists the instance's adapters. With adapters null, writes how many
      there are to count. Otherwise writes up to count of them, sets count
      to how many it wrote, and returns incomplete if there were more.
    returns: result
    params:
      - {name: instance, type: instance}
      - {name: count, type: u32, pointer: inout}
      - {name: adapters, type: adapter_info, array: count, pointer: out, optional: true}

  get_caps:
    doc: Writes everything about an adapter that stays the same while it runs. Needs no device.
    returns: result
    params:
      - {name: instance, type: instance}
      - {name: adapter, type: u32, doc: Index into the instance's adapter list.}
      - {name: caps, type: caps, pointer: out}

  get_formats:
    doc: >-
      Lists what an adapter does with each format, every format in the order
      bfr_format declares them. With formats null, writes how many there are
      to count. Otherwise writes up to count of them, sets count to how many
      it wrote, and returns incomplete if there were more.
    returns: result
    params:
      - {name: instance, type: instance}
      - {name: adapter, type: u32}
      - {name: count, type: u32, pointer: inout}
      - {name: formats, type: format_caps, array: count, pointer: out, optional: true}

  get_swapchain_caps:
    doc: >-
      Writes what a swapchain for the window in desc may be on an
      adapter. Asks the window system each time, since the window changes.
      Fails with present_unsupported when the adapter can't present to the window.
    returns: result
    params:
      - {name: instance, type: instance}
      - {name: adapter, type: u32}
      - {name: desc, type: swapchain_query, pointer: in}
      - {name: caps, type: swapchain_caps, pointer: out}

  get_swapchain_formats:
    doc: >-
      Lists the formats and color spaces a swapchain for the window in desc
      may use on an adapter, the order the window system gives. Only those BFR
      has names for. With formats null, writes how many there are to count.
      Otherwise writes up to count of them, sets count to how many it wrote,
      and returns incomplete if there were more. Fails as bfr_get_swapchain_caps
      does.
    returns: result
    params:
      - {name: instance, type: instance}
      - {name: adapter, type: u32}
      - {name: desc, type: swapchain_query, pointer: in}
      - {name: count, type: u32, pointer: inout}
      - {name: formats, type: swapchain_format, array: count, pointer: out, optional: true}

  get_budget:
    doc: >-
      Writes how much memory the device's process may use and uses now. Fails
      with unsupported when the driver cannot say.
    returns: result
    params:
      - {name: device, type: device}
      - {name: budget, type: memory_budget, pointer: out}

  create_device:
    doc: >-
      Opens an adapter with the queues desc asks for, preferring queue
      families that present to the window in desc, if any.
    returns: result
    params:
      - {name: instance, type: instance}
      - {name: desc, type: device_desc, pointer: in}
      - {name: device, type: device, pointer: out}

  destroy_device:
    doc: >-
      Destroys a device once the GPU has finished with it, with every
      handle it still owns. Null does nothing.
    params:
      - {name: device, type: device, optional: true}

  create_swapchain:
    doc: >-
      Creates a swapchain for the window in desc, which the device
      must be able to present to. It has no images until the first
      bfr_resize_swapchain gives it a size.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: swapchain_desc, pointer: in}
      - {name: swapchain, type: swapchain, pointer: out}

  resize_swapchain:
    doc: >-
      Rebuilds a swapchain's images at a new size, as its desc says. Fails with
      error_unsupported when the backend has no setting for a value of the desc,
      and error_swapchain_failed when the backend refuses; bfr_get_last_error
      gives the backend's call and result.
    returns: result
    params:
      - {name: device, type: device}
      - {name: swapchain, type: swapchain}
      - {name: width, type: u32}
      - {name: height, type: u32}
      - {name: images, type: swapchain_images, pointer: out}

  destroy_swapchain:
    doc: >-
      Waits for the GPU to finish with a swapchain and destroys it; when
      this returns, its window is no longer used. A handle that is already
      destroyed does nothing. Not while another thread is using the
      swapchain.
    params:
      - {name: device, type: device}
      - {name: swapchain, type: swapchain}

  acquire:
    doc: >-
      Takes the swapchain's next image, for bfr_begin_rendering. Fails with
      error_out_of_date when the swapchain has no images or no longer matches
      its window; bfr_resize_swapchain then gives it new ones. Fails with
      error_timeout when no image came in time.
    returns: result
    params:
      - {name: device, type: device}
      - {name: swapchain, type: swapchain}
      - name: timeout_ns
        type: u64
        doc: >-
          Nanoseconds to wait for an image, passed to the backend's acquire. Unused where acquire
          doesn't wait. Where the backend can only wait with no limit or for a time of its own, the
          largest u64 waits with no limit and any other for the backend's time.
      - {name: status, type: swapchain_status, pointer: out, doc: What the backend said of the swapchain.}

  present:
    doc: >-
      Shows the acquired image once what bfr_submit sent for it is done. Fails
      with error_out_of_date when the swapchain no longer matches its window;
      the image was still presented when it could be.
    returns: result
    params:
      - {name: device, type: device}
      - {name: swapchain, type: swapchain}
      - {name: status, type: swapchain_status, pointer: out, doc: What the backend said of the swapchain.}

  create_command_pool:
    doc: >-
      Creates a command pool, as desc says, with its lists made. Fails with
      error_limit_reached at the device's max_command_pools, or when fewer than
      desc.list_count of its max_command_lists are free.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: command_pool_desc, pointer: in}
      - {name: command_pool, type: command_pool, pointer: out}

  reset_command_pool:
    doc: >-
      Gives every list the pool made back to it, so bfr_begin_commands may use
      their memory again. A list from the pool still recording ends with it on
      Vulkan; on D3D12 and Metal it fails with error_invalid_argument.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_pool, type: command_pool}

  destroy_command_pool:
    doc: >-
      Destroys a command pool and every list it made, once the GPU has finished
      with them; the handles are invalid at once. A handle that is already
      destroyed does nothing. Not while another thread is using the pool.
    params:
      - {name: device, type: device}
      - {name: command_pool, type: command_pool}

  begin_commands:
    doc: >-
      Starts recording the pool's next list. Fails with error_limit_reached
      when every list it holds was handed out since it was last reset.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_pool, type: command_pool}
      - {name: command_list, type: command_list, pointer: out}

  begin_rendering:
    doc: >-
      Begins rendering to desc's attachments, with the image bfr_acquire took
      from swapchain as color attachment 0 when swapchain is not null, or as
      the image attachment 0's texture resolves into when it names one. Only the
      draws, direct and indirect, and the state they take, are recorded until
      bfr_end_rendering, which resolves the attachments that name a resolve
      texture. Fails with error_invalid_argument when no attachment is given,
      when a color attachment but the swapchain's names no texture, with a
      swapchain when there is no color attachment or attachment 0 names a
      resolve texture, and when a resolve texture is named with no texture;
      error_unsupported for a depth or stencil resolve mode, or a pair of
      them, bfr_caps_resolve doesn't have, on D3D12 and Metal.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: swapchain, type: swapchain}
      - {name: desc, type: rendering_desc, pointer: in}

  end_rendering:
    doc: >-
      Ends the rendering bfr_begin_rendering began; a swapchain image is then
      ready to present, and a texture is in the layout it was given in. Metal
      has no encoder to end when none is open, so there it fails with
      error_invalid_argument.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}

  set_viewport:
    doc: Sets the viewport the draws after it use. Metal sets it on the rendering's encoder, so there it fails with error_invalid_argument outside rendering.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: viewport, type: viewport, pointer: in}

  set_scissor:
    doc: Sets the scissor the draws after it keep to. Fails as bfr_set_viewport does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: scissor, type: rect, pointer: in}

  set_blend_constants:
    doc: >-
      Sets the color the constant blend factors of the draws after it read.
      Vulkan has no color until it is set, and Metal sets it on the
      rendering's encoder, so a draw that reads it needs it set in its
      rendering. Fails as bfr_set_viewport does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: red, type: f32}
      - {name: green, type: f32}
      - {name: blue, type: f32}
      - {name: alpha, type: f32}

  set_stencil_reference:
    doc: >-
      Sets the value the stencil test of the draws after it compares against,
      and stencil_op replace writes, on both faces. The low 8 bits count.
      Vulkan has no value until it is set, and Metal sets it on the
      rendering's encoder, so a draw that tests stencil needs it set in its
      rendering. Fails as bfr_set_viewport does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: reference, type: u32}

  bind_pipeline:
    doc: >-
      Makes pipeline the one draws or dispatches after it run, a graphics
      pipeline for draws and a compute one for dispatches, until another of its
      kind is bound. Draws assemble the pipeline's topology until bfr_set_topology.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pipeline, type: pipeline}

  set_topology:
    doc: >-
      Makes the draws after it assemble topology, which is of the bound
      graphics pipeline's kind, points, lines or triangles, as each backend
      requires, until the next bfr_bind_pipeline. Fails with
      error_invalid_argument for a value BFR doesn't have, and
      error_unsupported for a topology the backend has no form for (Metal's
      fan), or where bfr_caps_features.dynamic_topology is false.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: topology, type: topology}

  push_constants:
    doc: >-
      Sets the first size bytes of the push constants every shader reads, as
      bfr_pipeline states, for the draws and dispatches after it. size is at
      most the caps' max_push_constants_size, which the layout BFR makes
      holds. On Metal, which copies the bytes into the pool's ring, fails
      with error_invalid_argument past that size and error_limit_reached past
      the pool's push_constant_updates.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: data, type: u8, array: size, pointer: in}
      - {name: size, type: u32}

  bind_index_buffer:
    doc: >-
      Makes buffer, which has index usage, the one bfr_draw_indexed reads
      indices of type from, starting offset bytes in.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}
      - {name: type, type: index_type}

  draw:
    doc: >-
      Records a draw of vertex_count vertices, instance_count times, with the
      bound graphics pipeline, inside rendering. The vertex shader sees vertex
      indices from first_vertex. Whether it sees instance indices from
      first_instance or from 0 is the backend's: Vulkan and Metal count from
      first_instance, D3D12's SV_InstanceID from 0. Metal draws on the
      rendering's encoder, so there it fails with error_invalid_argument
      outside rendering.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: vertex_count, type: u32}
      - {name: instance_count, type: u32}
      - {name: first_vertex, type: u32}
      - {name: first_instance, type: u32}

  draw_indexed:
    doc: >-
      Records a draw of index_count indices read from the bound index buffer
      from first_index, each plus vertex_offset giving the vertex index the
      vertex shader sees, instance_count times, inside rendering. Instance
      indices are seen as bfr_draw says.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: index_count, type: u32}
      - {name: instance_count, type: u32}
      - {name: first_index, type: u32}
      - {name: vertex_offset, type: i32}
      - {name: first_instance, type: u32}

  dispatch:
    doc: >-
      Records a dispatch of x by y by z workgroups of the bound compute
      pipeline, outside rendering. Commands after a bfr_barrier see what it
      wrote.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: x, type: u32}
      - {name: y, type: u32}
      - {name: z, type: u32}

  draw_indirect:
    doc: >-
      Records draw_count draws as bfr_draw does, each with the
      bfr_draw_indirect_args buffer holds from offset, stride bytes apart.
      buffer has indirect usage; work that wrote the arguments is ordered
      before by a bfr_barrier. Fails with error_unsupported for draw_count
      above 1 on Metal, whose indirect draw has no count, and, on
      D3D12, a stride not in the device's indirect_strides; and as bfr_draw
      does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}
      - {name: draw_count, type: u32}
      - {name: stride, type: u32, doc: Bytes between two draws' arguments.}

  draw_indexed_indirect:
    doc: >-
      Records draw_count draws as bfr_draw_indexed does, each with the
      bfr_draw_indexed_indirect_args buffer holds from offset, stride bytes
      apart. Fails as bfr_draw_indirect does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}
      - {name: draw_count, type: u32}
      - {name: stride, type: u32, doc: Bytes between two draws' arguments.}

  draw_indirect_count:
    doc: >-
      Records bfr_draw_indirect's draws, as many as the 32-bit count
      count_buffer holds at count_offset when the GPU runs it, at most
      max_draw_count. count_buffer has indirect usage. Fails with
      error_unsupported on Metal, which has none, and as bfr_draw_indirect
      does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}
      - {name: count_buffer, type: buffer}
      - {name: count_offset, type: u64, doc: Bytes into count_buffer.}
      - {name: max_draw_count, type: u32}
      - {name: stride, type: u32, doc: Bytes between two draws' arguments.}

  draw_indexed_indirect_count:
    doc: >-
      Records bfr_draw_indexed_indirect's draws, as many as count_buffer
      holds, as bfr_draw_indirect_count does. Fails as it does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}
      - {name: count_buffer, type: buffer}
      - {name: count_offset, type: u64, doc: Bytes into count_buffer.}
      - {name: max_draw_count, type: u32}
      - {name: stride, type: u32, doc: Bytes between two draws' arguments.}

  dispatch_indirect:
    doc: >-
      Records a dispatch as bfr_dispatch does, of the bfr_dispatch_indirect_args
      buffer holds at offset. buffer has indirect usage. Fails as bfr_dispatch
      does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}

  draw_mesh:
    doc: >-
      Records a draw of x by y by z workgroups of the bound mesh pipeline's
      task shader, or of its mesh shader where it has none, within
      bfr_caps_mesh. A mesh pipeline is bound, and bfr_draw and
      bfr_draw_indexed take none. Fails with error_unsupported where
      bfr_caps_features.mesh_shader is false, and as bfr_draw does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: x, type: u32}
      - {name: y, type: u32}
      - {name: z, type: u32}

  draw_mesh_indirect:
    doc: >-
      Records draw_count mesh draws, each with the bfr_dispatch_indirect_args
      buffer holds from offset, stride bytes apart. Fails as bfr_draw_mesh and
      bfr_draw_indirect do.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}
      - {name: draw_count, type: u32}
      - {name: stride, type: u32, doc: Bytes between two draws' arguments.}

  draw_mesh_indirect_count:
    doc: >-
      Records bfr_draw_mesh_indirect's draws, as many as count_buffer holds,
      as bfr_draw_indirect_count does. Fails as bfr_draw_mesh and
      bfr_draw_indirect_count do.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}
      - {name: count_buffer, type: buffer}
      - {name: count_offset, type: u64, doc: Bytes into count_buffer.}
      - {name: max_draw_count, type: u32}
      - {name: stride, type: u32, doc: Bytes between two draws' arguments.}

  copy_buffer:
    doc: >-
      Records copies of regions from src to dst, outside rendering. src has
      copy_src usage and is device or upload memory; dst has copy_dst usage and
      is device or readback memory. Commands after a bfr_barrier in the list,
      or in a later submit that waits on its token, see what was copied.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: src, type: buffer}
      - {name: dst, type: buffer}
      - {name: regions, type: buffer_copy, array: region_count, pointer: in}
      - {name: region_count, type: u32}

  barrier:
    doc: >-
      Records a barrier, outside rendering: commands recorded after it in the
      list start once those before it have finished, and see what they wrote.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}

  texture_barrier:
    doc: >-
      Records a barrier, as bfr_barrier does, that also moves range's mip
      levels and layers of texture from layout before to layout after; the
      rest stay as they are. Outside rendering.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: texture, type: texture}
      - {name: before, type: texture_layout}
      - {name: after, type: texture_layout}
      - {name: range, type: texture_range, pointer: in}

  copy_buffer_to_texture:
    doc: >-
      Records copies of regions from buffer to texture, which is in layout
      copy_dst, outside rendering. buffer has copy_src usage and texture
      copy_dst. What was copied is seen as bfr_copy_buffer says.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: texture, type: texture}
      - {name: regions, type: buffer_texture_copy, array: region_count, pointer: in}
      - {name: region_count, type: u32}

  copy_texture_to_buffer:
    doc: >-
      Records copies of regions from texture, which is in layout copy_src, to
      buffer, outside rendering. texture has copy_src usage and buffer
      copy_dst. What was copied is seen as bfr_copy_buffer says.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: texture, type: texture}
      - {name: buffer, type: buffer}
      - {name: regions, type: buffer_texture_copy, array: region_count, pointer: in}
      - {name: region_count, type: u32}

  copy_texture:
    doc: >-
      Records copies of regions from src, which is in layout copy_src, to dst,
      which is in layout copy_dst, outside rendering. src has copy_src usage
      and dst copy_dst. What was copied is seen as bfr_copy_buffer says.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: src, type: texture}
      - {name: dst, type: texture}
      - {name: regions, type: texture_copy, array: region_count, pointer: in}
      - {name: region_count, type: u32}

  resolve_texture:
    doc: >-
      Records a resolve of one mip level and layer of src, a multisampled
      texture of a color format in layout resolve_src, into one of dst, a
      single-sample texture of its format in layout resolve_dst, outside
      rendering: the whole level, of the same size in both. src has
      color_attachment and copy_src usage, dst color_attachment and copy_dst;
      its format resolves, as bfr_format_caps.resolve says, and each texture
      has the mip level and layer named. Fails with error_device_failed when
      the backend gives no encoder for it (Metal). What was resolved is seen
      as bfr_copy_buffer says.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: src, type: texture}
      - {name: src_mip_level, type: u32}
      - {name: src_layer, type: u32}
      - {name: dst, type: texture}
      - {name: dst_mip_level, type: u32}
      - {name: dst_layer, type: u32}

  submit:
    doc: >-
      Sends recorded command lists to a queue, which runs them after what it
      was sent before and after the GPU passes the waits, and writes the token
      their completion signals. The command lists are gone afterwards. Calls on
      one queue must not overlap; the caller synchronizes them. Different
      queues may be sent to from different threads at once.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: submit_desc, pointer: in}
      - {name: token, type: token, pointer: out, optional: true}

  wait:
    doc: >-
      Blocks until the GPU has passed token, whichever queue it is on, which may be one no submit
      has returned yet, or until timeout_ns has passed, which fails with error_timeout.
    returns: result
    params:
      - {name: device, type: device}
      - {name: token, type: token, pointer: in}
      - name: timeout_ns
        type: u64
        doc: >-
          Nanoseconds to wait, passed to the backend's wait. A backend that counts in milliseconds
          is given them rounded up, and on D3D12 one past its longest count waits with no limit.

  poll:
    doc: Writes whether the GPU has passed token, without blocking.
    returns: result
    params:
      - {name: device, type: device}
      - {name: token, type: token, pointer: in}
      - {name: complete, type: bool, pointer: out}

  run_garbage_collection:
    doc: >-
      Frees the objects destroy calls retired whose submits the GPU has passed,
      and gives their slots back to the tables, as each create call also does
      first. Not for the frame path: it frees memory. Fails with
      error_device_failed when the backend cannot say what the GPU has passed.
    returns: result
    params:
      - {name: device, type: device}

  destroy_command_list:
    doc: >-
      Discards a command list that was not submitted; the pool hands it out
      again after its next reset. A handle that is already submitted or
      destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}

  create_buffer:
    doc: >-
      Creates a buffer, as desc says. Not for the frame path: it frees buffers
      the GPU is done with. Fails with error_invalid_argument for memory BFR
      doesn't have, error_out_of_memory when the backend says the memory
      ran out, error_limit_reached at the device's maximum of buffers, and
      error_device_failed when the backend refuses the desc or gives no buffer.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: buffer_desc, pointer: in}
      - {name: buffer, type: buffer, pointer: out}

  map_buffer:
    doc: >-
      Writes where the CPU reaches an upload or readback buffer. The pointer
      stays valid until the buffer is destroyed. CPU writes reach the GPU, and
      GPU writes reach the CPU once their token completes, without a flush.
      Fails with error_invalid_argument for device memory, and
      error_invalid_handle when the buffer is destroyed.
    returns: result
    params:
      - {name: device, type: device}
      - {name: buffer, type: buffer}
      - {name: data, type: opaque, pointer: out}

  get_buffer_slots:
    doc: >-
      Writes the buffer's indices in the storage and uniform buffer tables
      bfr_pipeline states, held from creation to destruction; BFR_NO_SLOT in a
      table its usage does not set.
    returns: result
    params:
      - {name: device, type: device}
      - {name: buffer, type: buffer}
      - {name: slots, type: buffer_slots, pointer: out}

  destroy_buffer:
    doc: >-
      Destroys a buffer once the GPU has finished with it; the handle is invalid
      at once. Not for the frame path: it records the point the buffer waits
      for and frees what the GPU is done with. A handle that is already
      destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: buffer, type: buffer}

  create_texture:
    doc: >-
      Creates a texture, as desc says. Not for the frame path: it frees
      textures the GPU is done with. Fails with error_out_of_memory when the
      backend says memory ran out, error_limit_reached at the device's maximum
      of textures, and error_device_failed when the backend refuses the desc
      or gives no texture.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: texture_desc, pointer: in}
      - {name: texture, type: texture, pointer: out}

  get_texture_slots:
    doc: Writes where the texture is in the bindless tables bfr_pipeline states.
    returns: result
    params:
      - {name: device, type: device}
      - {name: texture, type: texture}
      - {name: slots, type: texture_slots, pointer: out}

  destroy_texture:
    doc: >-
      Destroys a texture once the GPU has finished with it; the handle is
      invalid at once. Not for the frame path: it records the point the
      texture waits for and frees what the GPU is done with. A handle that is
      already destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: texture, type: texture}

  create_sampler:
    doc: >-
      Creates a sampler, as desc says, with a slot in the sampler table. Not
      for the frame path: it frees samplers the GPU is done with. Fails with
      error_invalid_argument for a value BFR does not have, error_unsupported
      when the backend has no setting for a member, error_limit_reached when
      the sampler table is full, and error_device_failed when the backend
      refuses the desc. Every other member reaches the backend as it is; the
      caps say what the adapter has.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: sampler_desc, pointer: in}
      - {name: sampler, type: sampler, pointer: out}

  get_sampler_slot:
    doc: Writes the sampler's index in the sampler table bfr_pipeline states, held from creation to destruction.
    returns: result
    params:
      - {name: device, type: device}
      - {name: sampler, type: sampler}
      - {name: slot, type: u32, pointer: out}

  destroy_sampler:
    doc: >-
      Destroys a sampler once the GPU has finished with it; the handle is
      invalid at once. Not for the frame path: it records the point the
      sampler waits for and frees what the GPU is done with. A handle that is
      already destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: sampler, type: sampler}

  create_compute_pipeline:
    doc: >-
      Creates a compute pipeline, as desc says, before returning. Not for the
      frame path: it compiles, and frees pipelines the GPU is done with. A
      desc.cache is looked in first, and the pipeline added on a miss. Fails
      with error_invalid_handle when desc.cache is gone, error_limit_reached
      at the device's maximum of pipelines, and error_device_failed when the
      backend refuses the code, the desc or the cache; the message carries
      what it said.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: compute_pipeline_desc, pointer: in}
      - {name: pipeline, type: pipeline, pointer: out}

  create_graphics_pipeline:
    doc: >-
      Creates a graphics pipeline, as desc says, before returning. Not for the
      frame path, as bfr_create_compute_pipeline is not. A desc.cache is used
      as there. A target of format undefined is an unused one. Fails with
      error_invalid_argument for a desc
      with more than max_color_targets targets, error_unsupported for a
      topology the backend has no form for (Metal's fan) and, on D3D12 and
      Metal, for an alpha_to_one, min_sample_shading or sample_mask whose
      feature the device lacks, error_invalid_handle when desc.cache is
      gone, error_limit_reached at the device's maximum of pipelines, and
      error_device_failed when the backend refuses the code, the desc or the
      cache; the message carries what it said.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: graphics_pipeline_desc, pointer: in}
      - {name: pipeline, type: pipeline, pointer: out}

  destroy_pipeline:
    doc: >-
      Destroys a pipeline once the GPU has finished with it; the handle is
      invalid at once. Not for the frame path: it records the point the
      pipeline waits for and frees what the GPU is done with. A handle that is
      already destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: pipeline, type: pipeline}

  create_pipeline_cache:
    doc: >-
      Creates a pipeline cache that starts with desc's data. Not for the frame
      path. Data from another adapter or driver makes an empty cache or fails
      with error_device_failed, as the backend does. Fails with
      error_unsupported where the backend makes none, as
      bfr_caps_features.pipeline_cache reports, and error_limit_reached at the
      device's maximum of pipeline caches.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: pipeline_cache_desc, pointer: in}
      - {name: cache, type: pipeline_cache, pointer: out}

  get_pipeline_cache_data:
    doc: >-
      Writes a pipeline cache's bytes, for a later bfr_pipeline_cache_desc.
      With data null, writes how many there are to size. Otherwise writes up
      to size of them, sets size to how many it wrote, and returns incomplete
      if there were more, or fails with error_device_failed, as the backend
      does. Not for the frame path. Fails with error_invalid_handle when the
      cache is gone.
    returns: result
    params:
      - {name: device, type: device}
      - {name: cache, type: pipeline_cache}
      - {name: size, type: size, pointer: inout}
      - {name: data, type: u8, array: size, pointer: out, optional: true}

  destroy_pipeline_cache:
    doc: >-
      Destroys a pipeline cache at once; pipelines made with it stay. Not for
      the frame path. Not while another thread is using the cache or creating
      a pipeline with it. A handle that is already destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: cache, type: pipeline_cache}

  create_timestamp_pool:
    doc: >-
      Creates a pool of desc's count GPU timestamps, written by lists on
      desc's queue. Not for the frame path. Fails with error_invalid_argument
      when the device has no such queue, error_limit_reached at the device's
      max_timestamp_pools, and error_device_failed when the backend refuses.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: timestamp_pool_desc, pointer: in}
      - {name: pool, type: timestamp_pool, pointer: out}

  destroy_timestamp_pool:
    doc: >-
      Destroys a timestamp pool once the GPU has finished with it; the handle
      is invalid at once. Not for the frame path. A handle that is already
      destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: pool, type: timestamp_pool}

  reset_timestamps:
    doc: >-
      Records a reset of count timestamps from first, which a backend that
      needs one before each write, the first too, is given; the others
      record nothing. Outside rendering.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: timestamp_pool}
      - {name: first, type: u32}
      - {name: count, type: u32}

  write_timestamp:
    doc: >-
      Records the GPU's timestamp at stage into the pool's timestamp index,
      with granularity where the backend takes one. Fails with
      error_invalid_argument for a stage or granularity BFR does not have,
      and error_unsupported for a stage the backend has no setting for where
      the list is (D3D12, Metal).
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: timestamp_pool}
      - {name: index, type: u32}
      - {name: stage, type: timestamp_stage}
      - {name: granularity, type: timestamp_granularity}

  resolve_timestamps:
    doc: >-
      Records a copy of count timestamps from first into buffer at offset, as
      raw ticks of bfr_caps_timestamps.entry_bytes each, once the GPU has
      written them. The buffer needs copy_dst usage. Outside rendering; fails
      with error_invalid_argument inside it on a backend with nothing to
      record it in there.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: timestamp_pool}
      - {name: first, type: u32}
      - {name: count, type: u32}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}

  get_timestamp_rate:
    doc: >-
      Writes how long a timestamp tick lasts on queue, as the backend gives
      it. Fails with error_invalid_argument when the device has no such queue.
    returns: result
    params:
      - {name: device, type: device}
      - {name: queue, type: u32}
      - {name: rate, type: timestamp_rate, pointer: out}

  calibrate_timestamps:
    doc: >-
      Writes a GPU timestamp on queue and clock's reading, taken together.
      Fails with error_invalid_argument when the device has no such queue or
      clock is not one BFR has, and error_unsupported for a clock
      bfr_caps_timestamps.host_clocks does not list.
    returns: result
    params:
      - {name: device, type: device}
      - {name: queue, type: u32}
      - {name: clock, type: host_clock}
      - {name: timestamps, type: calibrated_timestamps, pointer: out}

  create_query_pool:
    doc: >-
      Creates a pool of desc's count queries of desc's type. Not for the
      frame path. Fails with error_invalid_argument for a type BFR does not
      have, error_unsupported where bfr_caps_features.queries is false,
      error_limit_reached at the device's max_query_pools, and
      error_device_failed when the backend refuses.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: query_pool_desc, pointer: in}
      - {name: pool, type: query_pool, pointer: out}

  destroy_query_pool:
    doc: >-
      Destroys a query pool once the GPU has finished with it; the handle is
      invalid at once. Not for the frame path. A handle that is already
      destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: pool, type: query_pool}

  get_query_layout:
    doc: Writes where the pool's results land in the buffer bfr_resolve_queries writes.
    returns: result
    params:
      - {name: device, type: device}
      - {name: pool, type: query_pool}
      - {name: layout, type: query_layout, pointer: out}

  reset_queries:
    doc: >-
      Records a reset of count queries from first, which a backend that needs
      one before each begin, the first too, is given; the others record
      nothing.
      Outside rendering.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: query_pool}
      - {name: first, type: u32}
      - {name: count, type: u32}

  begin_query:
    doc: >-
      Records the start of counting into the pool's query index, ended by
      bfr_end_query on the same list. precise asks an occlusion query for an
      exact count, where bfr_caps_features.occlusion_query_precise. An
      occlusion query is begun inside rendering, into the pool the
      rendering's bfr_rendering_desc.occlusion_queries names.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: query_pool}
      - {name: index, type: u32}
      - {name: precise, type: bool}

  end_query:
    doc: Records the end of counting into the pool's query index.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: query_pool}
      - {name: index, type: u32}

  resolve_queries:
    doc: >-
      Records a copy of count queries' results from first into buffer at
      offset, laid out as bfr_get_query_layout says, once the GPU has written
      them. The buffer needs copy_dst usage. Outside rendering.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: query_pool}
      - {name: first, type: u32}
      - {name: count, type: u32}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}

  begin_debug_label:
    doc: >-
      Records the start of a region of the list's commands named by label,
      ended by bfr_end_debug_label; regions nest. Where
      bfr_caps_features.debug_labels. Fails with error_unsupported where it
      is false, error_limit_reached when the name is longer than the device's
      max_debug_label_length, and error_invalid_argument when the name holds
      a '\0', which the backend reads as its end.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: label, type: debug_label, pointer: in}

  end_debug_label:
    doc: Records the end of the list's innermost labelled region. Fails with error_unsupported where bfr_caps_features.debug_labels is false.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}

  insert_debug_label:
    doc: Records label at this point in the list's commands. Fails as bfr_begin_debug_label.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: label, type: debug_label, pointer: in}

  begin_queue_debug_label:
    doc: >-
      Starts a region of the work submitted to queue named by label, ended by
      bfr_end_queue_debug_label; regions nest. Where
      bfr_caps_features.queue_debug_labels. Fails as bfr_begin_debug_label,
      with error_unsupported where queue_debug_labels is false and
      error_invalid_argument when the device has no such queue.
    returns: result
    params:
      - {name: device, type: device}
      - {name: queue, type: u32}
      - {name: label, type: debug_label, pointer: in}

  end_queue_debug_label:
    doc: Ends the innermost labelled region of queue's work. Fails with error_unsupported where bfr_caps_features.queue_debug_labels is false, and error_invalid_argument when the device has no such queue.
    returns: result
    params:
      - {name: device, type: device}
      - {name: queue, type: u32}

  insert_queue_debug_label:
    doc: Names this point in the work submitted to queue. Fails as bfr_begin_queue_debug_label.
    returns: result
    params:
      - {name: device, type: device}
      - {name: queue, type: u32}
      - {name: label, type: debug_label, pointer: in}

  create_sparse_memory:
    doc: >-
      Creates desc's size bytes of device memory for the tiles of the sparse
      resources desc names. Not for the frame path. Fails with
      error_invalid_argument for no resource, error_unsupported for a tile_bytes the backend doesn't take or resources
      the backend can't hold in one memory, error_limit_reached at the
      device's max_sparse_memories, error_out_of_memory when the backend says
      memory ran out, and error_device_failed when it refuses.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: sparse_memory_desc, pointer: in}
      - {name: memory, type: sparse_memory, pointer: out}

  destroy_sparse_memory:
    doc: >-
      Destroys sparse memory once the GPU has passed every submit and mapping
      made before the call; the handle is invalid at once. Tiles still mapped
      to it read as unmapped ones do after. Not for the frame path. A handle
      that is already destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: memory, type: sparse_memory}

  get_texture_tiling:
    doc: >-
      Writes how aspect of a sparse texture is cut into tiles. Fails with
      error_invalid_argument when the texture is not sparse or has no such
      aspect, and error_unsupported where the backend gives no tiling for it.
    returns: result
    params:
      - {name: device, type: device}
      - {name: texture, type: texture}
      - {name: aspect, type: texture_aspect}
      - {name: tiling, type: texture_tiling, pointer: out}

  get_buffer_tiling:
    doc: Writes how a sparse buffer is cut into tiles. Fails with error_invalid_argument when it is not sparse.
    returns: result
    params:
      - {name: device, type: device}
      - {name: buffer, type: buffer}
      - {name: tiling, type: buffer_tiling, pointer: out}

  get_sparse_format:
    doc: >-
      Writes whether a sparse texture as desc says can be made, and its tiles'
      shape, as the backend says. Fails with error_invalid_argument for an
      enum value BFR does not have, and error_unsupported for a tile_bytes the
      backend doesn't take.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: sparse_format_desc, pointer: in}
      - {name: format, type: sparse_format, pointer: out}

  update_tile_mappings:
    doc: >-
      Maps desc's regions of its sparse texture and buffer to its memory, or
      unmaps them, on desc's queue once the GPU has passed the waits, and
      writes the token the mappings' completion signals; work that uses them
      waits on it. Calls on one queue must not overlap, bfr_submit included.
      Fails with error_invalid_argument for a queue the device does not have,
      a region that maps with no memory, or more than max_tile_mappings
      regions of either kind, error_unsupported for a region the backend has
      no form for,
      and error_device_failed when the backend refuses.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: tile_mapping_desc, pointer: in}
      - {name: token, type: token, pointer: out, optional: true}

  get_acceleration_structure_sizes:
    doc: >-
      Writes the bytes an acceleration structure built from inputs takes, and
      the scratch bytes its build and update take, as the backend says. Fails
      with error_unsupported where bfr_caps_features.acceleration_structure is
      false, or for opacity micromaps, their flags or triangles that take
      their opacity from one where bfr_caps_features.opacity_micromap is,
      partitioned top ones where bfr_caps_features.partitioned_top is, or
      motion where bfr_caps_features.ray_tracing_motion is,
      error_invalid_argument for an enum value BFR doesn't have, triangles
      naming a structure
      other than an opacity micromap as theirs or usages past
      micromap_usages, or motion keyframes other than the backend takes
      (Vulkan, two) or on an opacity micromap or partitioned top structure
      where the backend's has none (Vulkan), error_invalid_handle for a micromap that is gone, and
      error_limit_reached past the device's max_build_geometries.
    returns: result
    params:
      - {name: device, type: device}
      - {name: inputs, type: acceleration_structure_inputs, pointer: in}
      - {name: sizes, type: acceleration_structure_sizes, pointer: out}

  create_acceleration_structure:
    doc: >-
      Creates an empty acceleration structure of desc's size bytes, which a
      build fills. Not for the frame path: it frees structures the GPU is done
      with. Fails with error_unsupported where
      bfr_caps_features.acceleration_structure is false,
      error_invalid_argument for an enum value BFR doesn't have,
      error_unsupported for motion_keyframes where
      bfr_caps_features.ray_tracing_motion is false, for an opacity
      micromap where bfr_caps_features.opacity_micromap is, or for a
      partitioned top structure where bfr_caps_features.partitioned_top is,
      error_invalid_argument for motion_keyframes other than the backend
      takes (Vulkan, two) or on an opacity micromap or partitioned top
      structure where the backend's has none (Vulkan), or capture_replay on an
      opacity micromap where the backend gives it no reference (Vulkan),
      error_limit_reached at the device's maximum or, for a top or
      partitioned top structure on a device with slots in its table, when
      they are all held, error_out_of_memory when the backend says memory ran
      out, and error_device_failed when it refuses; a replay at a reference
      the backend cannot give fails with error_out_of_memory or
      error_device_failed, as its API says.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: acceleration_structure_desc, pointer: in}
      - {name: structure, type: acceleration_structure, pointer: out}

  get_acceleration_structure_slot:
    doc: >-
      Writes a top acceleration structure's index in the acceleration
      structure table bfr_pipeline states, or a partitioned top one's in the
      partitioned top table, held from creation to destruction. Fails with
      error_invalid_argument for any other, or on a device made with no slots
      in its table.
    returns: result
    params:
      - {name: device, type: device}
      - {name: structure, type: acceleration_structure}
      - {name: slot, type: u32, pointer: out}

  write_motion_instances:
    doc: >-
      Writes instances to data as the records a top acceleration structure
      with motion is built from, bfr_caps_ray_tracing.motion_instance_size
      bytes apart, the last taking only the bytes of the backend's record,
      their keyframes read from keyframes, on the CPU. On Vulkan a record is
      VkAccelerationStructureMotionInstanceNV's 152 bytes, 160 bytes apart.
      Fails as bfr_write_instances does, with error_unsupported where
      bfr_caps_features.ray_tracing_motion is false, and
      error_invalid_argument for size too small for them, a moving instance whose keyframes run past
      keyframes, or number other than the backend's record holds (Vulkan's,
      two).
    returns: result
    params:
      - {name: device, type: device}
      - {name: instances, type: acceleration_structure_motion_instance, array: instance_count, pointer: in, optional: true}
      - {name: instance_count, type: u32}
      - {name: keyframes, type: motion_keyframe, array: keyframe_count, pointer: in, optional: true}
      - {name: keyframe_count, type: u32}
      - {name: data, type: opaque, doc: Where the records go.}
      - {name: size, type: size, doc: Bytes of data.}

  get_acceleration_structure_reference:
    doc: >-
      Writes what an instance record names a bottom acceleration structure by,
      for records the GPU writes, as bfr_write_instances lays them out; of a
      partitioned top structure, what the backend names it by (Vulkan, its
      address). Fails with error_invalid_argument for an opacity micromap
      where the backend gives it none (Vulkan).
    returns: result
    params:
      - {name: device, type: device}
      - {name: structure, type: acceleration_structure}
      - {name: reference, type: u64, pointer: out}

  capture_acceleration_structure:
    doc: >-
      Writes what bfr_acceleration_structure_desc.replay takes to make a
      structure again at this one's reference, of one made with
      capture_replay; all zero for one made without. Fails with
      error_invalid_handle when it is destroyed.
    returns: result
    params:
      - {name: device, type: device}
      - {name: structure, type: acceleration_structure}
      - {name: capture, type: acceleration_structure_capture, pointer: out}

  destroy_acceleration_structure:
    doc: >-
      Destroys an acceleration structure once the GPU has passed every submit
      made before the call; the handle is invalid at once. A top structure
      reads the bottom ones built into it while rays are traced against it.
      Not for the frame path. A handle that is already destroyed does
      nothing.
    params:
      - {name: device, type: device}
      - {name: structure, type: acceleration_structure}

  write_instances:
    doc: >-
      Writes instances to data as the records a top acceleration structure is
      built from, bfr_caps_ray_tracing.instance_size bytes each, on the CPU.
      On Vulkan a record is VkAccelerationStructureInstanceKHR's 64 bytes: the
      transform's 12 floats, then the custom index in the low 24 bits of a
      32-bit value and the mask in its high 8, then the hit group offset in
      the low 24 bits of another and the flags in its high 8 (1 cull disable,
      2 front counter-clockwise, 4 force opaque, 8 force non-opaque, 16 force
      opacity micromap 2-state, 32 disable opacity micromaps), then
      the 64-bit reference bfr_get_acceleration_structure_reference gives, 0
      for an instance no ray hits. Fails with error_unsupported where
      bfr_caps_features.acceleration_structure is false,
      error_invalid_argument when size is too small, for an enum value BFR
      doesn't have, or an instance naming an opacity micromap where the
      backend gives it no reference (Vulkan), and error_invalid_handle for a
      structure that is gone. An index or offset keeps its low 24 bits, and a
      bottom_structure is named where it is not null, else bottom_reference.
    returns: result
    params:
      - {name: device, type: device}
      - {name: instances, type: acceleration_structure_instance, array: instance_count, pointer: in, optional: true}
      - {name: instance_count, type: u32}
      - {name: data, type: opaque, doc: Where the records go.}
      - {name: size, type: size, doc: Bytes of data.}

  build_acceleration_structure:
    doc: >-
      Records build, outside rendering, on a queue whose kind runs compute. A
      barrier orders the work that wrote its inputs before it, and its readers
      and any reuse of its scratch after. Fails with error_unsupported where
      bfr_caps_features.acceleration_structure is false,
      error_invalid_argument for inputs bfr_get_acceleration_structure_sizes
      refuses, an opacity micromap updated where the backend builds one only
      whole (Vulkan), or a buffer with no address,
      error_limit_reached past
      the device's max_build_geometries, and error_invalid_handle for a
      structure or buffer that is gone.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: build, type: acceleration_structure_build, pointer: in}

  build_acceleration_structure_indirect:
    doc: >-
      Records build as bfr_build_acceleration_structure does, but with each
      geometry's counts read by the GPU as it runs: one
      bfr_acceleration_structure_build_range per geometry of build's inputs,
      in order, stride bytes apart from offset in ranges, which has indirect
      usage; offset and stride are multiples of 4. The inputs' counts are the
      most a range names. Fails with error_unsupported where the backend has
      no indirect builds (D3D12, Metal, until they resume),
      error_invalid_argument for an opacity micromap where the backend builds
      none so (Vulkan) or a partitioned top one, whose counts the GPU reads in
      every build, and as bfr_build_acceleration_structure does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: build, type: acceleration_structure_build, pointer: in}
      - {name: ranges, type: buffer}
      - {name: offset, type: u64, doc: Bytes into ranges.}
      - {name: stride, type: u32, doc: Bytes from one range to the next.}

  get_cluster_sizes:
    doc: >-
      Writes the bytes a cluster operation from inputs writes and the scratch
      it takes, as the backend says: size is every structure's bytes for
      implicit_destinations and one structure's at most for
      explicit_destinations; for compute_sizes the backend gives only
      build_scratch. Fails with error_unsupported where
      bfr_caps_features.cluster_acceleration_structure is false, or for flags
      of opacity micromaps where bfr_caps_features.opacity_micromap is, and
      error_invalid_argument for an enum value BFR doesn't have.
    returns: result
    params:
      - {name: device, type: device}
      - {name: inputs, type: cluster_inputs, pointer: in}
      - {name: sizes, type: acceleration_structure_sizes, pointer: out}

  build_clusters:
    doc: >-
      Records build, a cluster operation, outside rendering, on a queue whose
      kind runs compute: the GPU reads its records and count as it runs. A
      barrier orders the work that wrote its records, count and the
      structures it reads before it, and their readers and any reuse of its
      scratch after. Traces reach the cluster bottom structures it builds
      only through pipelines made with allow_clusters. Fails with
      error_unsupported as bfr_get_cluster_sizes does,
      error_invalid_argument for inputs bfr_get_cluster_sizes refuses or a
      buffer with no address, and error_invalid_handle for a list or buffer
      that is gone.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: build, type: cluster_build, pointer: in}

  copy_acceleration_structure:
    doc: >-
      Records a copy of src into dst, not overlapping, as builds are recorded:
      dst at least src's size, or its current_size where
      bfr_caps_features.acceleration_structure_current_size; of an opacity
      micromap, a micromap made as src was. Fails with error_unsupported as
      bfr_build_acceleration_structure does, error_invalid_argument for a
      micromap and a structure of another type, or a partitioned top structure
      where the backend copies none (Vulkan), and error_invalid_handle for a
      structure that is gone.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: dst, type: acceleration_structure}
      - {name: src, type: acceleration_structure}

  create_shader:
    doc: >-
      Creates a shader from code, compiled once, for the ray tracing pipelines
      made from it. Not for the frame path. Fails with error_unsupported where the backend has no shader objects yet
      (D3D12, Metal), error_limit_reached at the device's maximum, and
      error_device_failed when the backend refuses the code.
    returns: result
    params:
      - {name: device, type: device}
      - {name: code, type: shader_code, pointer: in}
      - {name: shader, type: shader, pointer: out}

  destroy_shader:
    doc: >-
      Destroys a shader at once; pipelines made from it stay. Not for the
      frame path. Not while another thread is making a pipeline from it. A
      handle that is already destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: shader, type: shader}

  create_ray_tracing_pipeline:
    doc: >-
      Creates a ray tracing pipeline, as desc says, before returning. Not for
      the frame path. A desc.cache is looked in first, and the pipeline added
      on a miss. Fails with error_unsupported where
      bfr_caps_features.ray_tracing_pipeline is false, or for library or
      libraries where bfr_caps_features.ray_tracing_pipeline_library is false,
      allow_opacity_micromaps where bfr_caps_features.opacity_micromap
      is false, allow_motion where bfr_caps_features.ray_tracing_motion is
      false, or allow_clusters where
      bfr_caps_features.cluster_acceleration_structure is false,
      error_invalid_argument for an enum value BFR doesn't have, a stack_size
      past 32 bits on Vulkan, which takes no more, or replay_identifiers
      neither none nor holding every group's, error_invalid_handle for a shader,
      library or desc.cache that is gone, error_limit_reached at the device's maximum of
      pipelines, and error_device_failed when the backend refuses the desc;
      the message carries what it said.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: ray_tracing_pipeline_desc, pointer: in}
      - {name: pipeline, type: pipeline, pointer: out}

  get_shader_identifiers:
    doc: >-
      Writes count groups' identifiers from first,
      bfr_caps_ray_tracing.identifier_size bytes each, into data, for binding
      table records. Fails with error_unsupported where
      bfr_caps_features.ray_tracing_pipeline is false, and
      error_invalid_argument when size is too small.
    returns: result
    params:
      - {name: device, type: device}
      - {name: pipeline, type: pipeline}
      - {name: first, type: u32}
      - {name: count, type: u32}
      - {name: data, type: opaque, doc: Where the identifiers go.}
      - {name: size, type: size, doc: Bytes of data.}

  get_capture_replay_identifiers:
    doc: >-
      Writes count groups' capture-replay identifiers from first,
      bfr_caps_ray_tracing.capture_replay_identifier_size bytes each, into
      data, of a pipeline made with capture_replay, for
      bfr_ray_tracing_pipeline_desc.replay_identifiers; of a library, where
      bfr_caps_features.pipeline_library_identifiers. Fails with
      error_unsupported where bfr_caps_features.ray_tracing_pipeline is false,
      and as bfr_get_shader_identifiers does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: pipeline, type: pipeline}
      - {name: first, type: u32}
      - {name: count, type: u32}
      - {name: data, type: opaque, doc: Where the identifiers go.}
      - {name: size, type: size, doc: Bytes of data.}

  trace_rays:
    doc: >-
      Records a trace of desc's rays with the bound ray tracing pipeline,
      outside rendering, on a queue whose kind runs compute; commands after a
      barrier see what it wrote. Fails with error_unsupported where
      bfr_caps_features.ray_tracing_pipeline is false,
      error_invalid_argument for a table buffer with no address, and
      error_invalid_handle for a buffer that is gone.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: desc, type: trace_rays_desc, pointer: in}

  trace_rays_indirect:
    doc: >-
      Records a trace as bfr_trace_rays does, of the
      bfr_trace_rays_indirect_args buffer holds at offset, a multiple of 4;
      buffer has indirect usage. Fails with error_unsupported where
      bfr_caps_features.trace_rays_indirect is false, and as bfr_trace_rays
      does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}

  get_buffer_address:
    doc: >-
      Writes the buffer's GPU address, for the addresses
      bfr_trace_rays_indirect_args, cluster records and shaders read; every
      buffer has one where bfr_caps_features.buffer_address. Fails with
      error_unsupported where it is false.
    returns: result
    params:
      - {name: device, type: device}
      - {name: buffer, type: buffer}
      - {name: address, type: u64, pointer: out}

  create_acceleration_structure_property_pool:
    doc: >-
      Creates a pool of desc's count entries of its property. Not for the
      frame path. Fails with error_unsupported where
      bfr_caps_features.acceleration_structure, or the property's own feature,
      or for opacity_micromaps bfr_caps_features.opacity_micromap, is false,
      error_invalid_argument for an enum value BFR doesn't have or a property
      of micromaps the backend writes none of (Vulkan writes only compacted
      and serialized sizes),
      error_limit_reached at the device's
      max_acceleration_structure_property_pools, and error_device_failed when
      the backend refuses.
    returns: result
    params:
      - {name: device, type: device}
      - {name: desc, type: acceleration_structure_property_pool_desc, pointer: in}
      - {name: pool, type: acceleration_structure_property_pool, pointer: out}

  destroy_acceleration_structure_property_pool:
    doc: >-
      Destroys a property pool once the GPU has passed every submit made
      before the call; the handle is invalid at once. Not for the frame path.
      A handle that is already destroyed does nothing.
    params:
      - {name: device, type: device}
      - {name: pool, type: acceleration_structure_property_pool}

  reset_acceleration_structure_properties:
    doc: >-
      Records a reset of count entries from first, which a backend that needs
      one before an entry is written, the first time too, is given; the others
      record nothing. Outside rendering, on a queue whose kind runs compute.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: acceleration_structure_property_pool}
      - {name: first, type: u32}
      - {name: count, type: u32}

  write_acceleration_structure_properties:
    doc: >-
      Records writes of structures' property into the pool's entries from
      first, in order, outside rendering, on a queue whose kind runs compute.
      A barrier orders their builds before it. A compacted_size is of
      structures built with allow_compaction, a serialized_bottom_count of top
      ones. Fails with error_invalid_argument for more structures than the
      pool holds from first, or for a partitioned top structure where the backend
      writes none of its properties (Vulkan), and error_invalid_handle for a
      structure that is gone.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: acceleration_structure_property_pool}
      - {name: first, type: u32}
      - {name: structures, type: acceleration_structure, array: structure_count, pointer: in, optional: true}
      - {name: structure_count, type: u32}

  resolve_acceleration_structure_properties:
    doc: >-
      Records a copy of count entries from first into buffer at offset, a
      multiple of 8, as bfr_caps_ray_tracing.property_entry_bytes each, once
      the GPU has written them. buffer has copy_dst usage. Outside rendering,
      on a queue whose kind runs compute.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: pool, type: acceleration_structure_property_pool}
      - {name: first, type: u32}
      - {name: count, type: u32}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}

  compact_acceleration_structure:
    doc: >-
      Records a compact copy of src, built with allow_compaction, into dst, at
      least its compacted_size, as builds are recorded. Fails as
      bfr_copy_acceleration_structure does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: dst, type: acceleration_structure}
      - {name: src, type: acceleration_structure}

  serialize_acceleration_structure:
    doc: >-
      Records src serialized into buffer at offset, a multiple of 256, its
      serialized_size bytes: serialized_identifier_size bytes of identifier,
      then the backend's header and data. A top structure's data holds its
      bottom structures' references, which the caller rewrites with
      bfr_get_acceleration_structure_reference values before deserializing it
      on another device. buffer has acceleration_structure_data usage. As
      builds are recorded. Fails with error_unsupported where
      bfr_caps_features.acceleration_structure_serialization is false, and
      error_invalid_argument for a partitioned top structure
      where the backend serializes none (Vulkan).
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: src, type: acceleration_structure}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}

  deserialize_acceleration_structure:
    doc: >-
      Records the structure buffer holds at offset, a multiple of 256,
      deserialized into dst, of its type and at least the size the data names;
      its identifier is one bfr_serialized_compatible says the device takes.
      Fails as bfr_serialize_acceleration_structure does.
    returns: result
    params:
      - {name: device, type: device}
      - {name: command_list, type: command_list}
      - {name: buffer, type: buffer}
      - {name: offset, type: u64, doc: Bytes into the buffer.}
      - {name: dst, type: acceleration_structure}

  serialized_compatible:
    doc: >-
      Writes whether the device deserializes a structure of type that begins
      with identifier, serialized_identifier_size bytes. Fails with
      error_unsupported where
      bfr_caps_features.acceleration_structure_serialization is false, or for
      an opacity micromap where bfr_caps_features.opacity_micromap is, and
      error_invalid_argument for an enum value BFR doesn't have or a
      partitioned top structure where the backend serializes none (Vulkan).
    returns: result
    params:
      - {name: device, type: device}
      - {name: type, type: acceleration_structure_type}
      - {name: identifier, type: opaque, doc: The serialized structure's first serialized_identifier_size bytes.}
      - {name: compatible, type: bool, pointer: out}

  get_ray_tracing_stack_size:
    doc: >-
      Writes the bytes of stack one shader of group takes, for
      bfr_ray_tracing_pipeline_desc.stack_size. The group has that shader.
      Fails with error_unsupported where
      bfr_caps_features.ray_tracing_pipeline is false, and
      error_invalid_argument for a pipeline that is not a ray
      tracing one or an enum value BFR doesn't have.
    returns: result
    params:
      - {name: device, type: device}
      - {name: pipeline, type: pipeline}
      - {name: group, type: u32}
      - {name: shader, type: ray_tracing_group_shader}
      - {name: stack_size, type: u64, pointer: out}

  get_call_timings:
    doc: >-
      Lists the CPU time spent in each of the device's calls since it was
      made, indexed by bfr_call. With timings null, writes how many there are
      to count. Otherwise writes up to count of them, sets count to how many
      it wrote, and returns incomplete if there were more. Fails with
      error_invalid_argument when the instance's desc did not set
      call_timings.
    returns: result
    params:
      - {name: device, type: device}
      - {name: count, type: u32, pointer: inout}
      - {name: timings, type: call_timing, array: count, pointer: out, optional: true}

  get_instance_call_timings:
    doc: >-
      Lists the CPU time spent in each of the instance's own calls since it
      was made, indexed by bfr_call, as bfr_get_call_timings lists a
      device's; its devices count theirs. Fails as bfr_get_call_timings does.
    returns: result
    params:
      - {name: instance, type: instance}
      - {name: count, type: u32, pointer: inout}
      - {name: timings, type: call_timing, array: count, pointer: out, optional: true}
